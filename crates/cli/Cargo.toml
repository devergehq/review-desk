[package]
name = "review-desk"
description = "Review Desk: the record of an agent-assisted code review."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "review-desk"
path = "src/main.rs"

# Forwarded to the server: see `crates/server/Cargo.toml`. `web/` builds with it for
# `pnpm run e2e`, and nothing else does.
[features]
e2e = ["review-desk-server/e2e"]
# Forwarded too: see `crates/server/Cargo.toml`. `tests/post.rs` needs it for the tests that
# stand up an Allele; CI runs the suite with `--all-features`.
fake-allele = ["review-desk-server/fake-allele"]

[dependencies]
review-desk-store = { path = "../store" }
review-desk-harvest = { path = "../harvest" }
review-desk-server = { path = "../server" }
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
# `tests/post.rs` changes an approved draft under the store to prove `post` refuses it. No
# command changes an approved draft — that is the point — so the test writes the column
# itself, as `crates/server/tests/staleness.rs` does. Test-only, and already a dependency of
# the store.
rusqlite.workspace = true
