name: CI

# **Checks run once a pull request is ready.** The types below add `ready_for_review` and
# `converted_to_draft`, every job is gated on the pull request not being a draft, and
# `workflow_dispatch` keeps any branch checkable by hand. DEV-961; the README states the rule
# under "Build and test".
#
# `converted_to_draft` is here to STOP work, not to start it: its jobs skip like any draft's,
# and because the run joins the concurrency group below with `cancel-in-progress`, it cancels
# whatever is still running from when the pull request was ready. Without it, converting back
# to a draft left an in-flight job billing to its timeout.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # SQLite is compiled from source by rusqlite's bundled feature, so caching the
      # build is worth more here than it would be otherwise.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The job above has no Node, so what it just built and tested is the no-front-end
      # binary. This asserts that deliberately, rather than leaving it as a property of
      # which tools the runner happens to have.
      - name: The binary built without Node says so at /
        run: |
          cargo build
          ./target/debug/review-desk serve --port 0 --json > served.json &
          server=$!
          for _ in $(seq 1 50); do
            [ -s served.json ] && break
            sleep 0.2
          done
          url=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' served.json)
          test -n "$url" || { echo "serve printed nothing"; cat served.json; exit 1; }
          curl -fsS "${url}api/v1/health" | tee health.json
          grep -q '"front_end_embedded":false' health.json
          curl -fsS "$url" | grep -q "The front end was not built into this binary."
          kill "$server"
        env:
          REVIEW_DESK_DB: ${{ runner.temp }}/ci-no-front-end.db

  embedded:
    name: The binary with the dashboard in it
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-embedded-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-embedded-${{ runner.os }}-

      # The one command sequence the README documents, run as documented. If it stops
      # producing a binary with the dashboard in it, this is where that is found.
      - name: Build the dashboard
        run: pnpm install --frozen-lockfile && pnpm run generate
        working-directory: web

      - name: Build and test with the dashboard embedded
        run: cargo test -p review-desk-server

      - name: The embedded dashboard is served
        run: |
          cargo build
          ./target/debug/review-desk serve --port 0 --json > served.json &
          server=$!
          for _ in $(seq 1 50); do
            [ -s served.json ] && break
            sleep 0.2
          done
          url=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' served.json)
          test -n "$url" || { echo "serve printed nothing"; cat served.json; exit 1; }
          curl -fsS "${url}api/v1/health" | grep -q '"front_end_embedded":true'
          # The index, a prerendered client-side route, and the API, from one binary.
          curl -fsS "$url" | grep -qi "<!doctype html>"
          curl -fsS "${url}reviews/17" | grep -qi "<!doctype html>"
          kill "$server"
        env:
          REVIEW_DESK_DB: ${{ runner.temp }}/ci-embedded.db
