# Redocly lint configuration for the Review Desk local API.
#
# `security-defined` is on. It was off until DEV-1346, when this version of Review Desk had
# no authentication at all and an empty scheme would have implied one; the comment that
# stood here said to turn it back on in the change that added authentication, and DEV-1346
# is that change. Reading is open — the document's top-level `security: [{}]` says so in
# words a linter can check — and the six developer acts name `developerCookie`.
extends:
  - recommended

rules:
  security-defined: error

apis:
  review-desk@v1:
    root: ./openapi.yaml
