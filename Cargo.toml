[workspace]
# A glob, so a later slice can add its crate — the HTTP server that serves the
# embedded front end — without editing this list.
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/devergehq/review-desk"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
