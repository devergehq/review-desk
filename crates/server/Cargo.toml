[package]
name = "review-desk-server"
description = "The Review Desk local HTTP server: the contract's JSON API and the embedded dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "review_desk_server"
path = "src/lib.rs"

[dependencies]
review-desk-store = { path = "../store" }
review-desk-harvest = { path = "../harvest" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Minimal on purpose: the default features add `form`, `json`, `query`, `matched-path`,
# `original-uri`, `tower-log` and `tracing`, none of which this server uses. The handlers
# build their own `serde_json` documents and `route.rs` parses its own query strings.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

# `rt` for the runtime and its blocking pool, `net` for the listener, `sync` for the one
# notification that stops a spawned server. No `rt-multi-thread`: see `src/lib.rs`.
tokio = { version = "1.53.2", default-features = false, features = ["rt", "net", "sync"] }

# The conformance test reads contract/openapi.yaml and validates responses against it.
# Both of these are test-only on purpose: the shipped binary gains neither, and a schema
# validator in the binary would be 78 crates to check what the handlers already know.
[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }

# `tests/concurrency.rs` opens several connections in one burst without waiting for any of
# them, which needs a socket it can set non-blocking *before* connecting -- something
# `std::net::TcpStream` cannot do, because connecting is its constructor. Test-only, and
# already in the tree as one of tokio's own dependencies.
socket2 = "0.6"
serde_norway = "0.9"
tempfile.workspace = true

# `tests/staleness.rs` ages a rule's last citation past the sixty-day window. The store
# has no function for moving a time backwards and should not grow one so that a test can
# pass — `crates/store/tests/rules.rs` reaches for SQL for the same reason — so the test
# opens the same file and writes the column itself. Test-only: nothing in `src/` opens the
# database, which is the project's first rule of interaction.
rusqlite.workspace = true
time = "0.1.45"
