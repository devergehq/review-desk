# What Review Desk is knowingly living with, and until when.
#
# Two checks read this file: `tools/release_age.py`, which fails when a direct dependency's
# latest release is more than a year old, and `tools/advisory_scan.py`, which fails on a
# known vulnerability. An entry here is the only thing that makes either of them pass over
# a finding, and every entry carries the same four justifications:
#
#   reason      — why this is acceptable. Not "known issue": the failure it does not cause.
#   decided_by  — who decided. A person, not a team and not an agent.
#   look_again  — when to look again. In the past, the check fails. More than 550 days
#                 away, the entry is rejected: a date nobody will reach is an exemption
#                 wearing the shape of a review.
#
# An entry with a missing key, an unknown key, a reason under twenty characters or a date
# that is not a bare TOML date is rejected and fails the check. That is deliberate — a typo
# like `look-again` would otherwise read as an entry with no expiry, and the check would
# still pass. An entry for a dependency or advisory nothing reports any more also fails, so
# the list cannot quietly accumulate.
#
# Adding an entry is a decision about the product. `docs/dependencies.md` has the steps.

# --------------------------------------------------------------------------- release age

[[release_age]]
dependency = "serde_norway"
ecosystem = "cargo"
reason = """
Test-only, and the best-maintained option that exists. It parses contract/openapi.yaml in \
the server's conformance test and is not in the shipped binary. Its upstream, serde_yaml, \
was archived by its author in 2024, and every serde-integrated successor is worse: \
serde_yaml_ng last released 2024-05-26, 200 days older than this one, and serde_yml is on \
0.0.x with contested provenance. yaml-rust2 and saphyr are current and popular but are \
parsers with no serde integration, so moving to one means hand-writing the conversion to \
serde_json::Value - not a small change for a test. 5.98M recent downloads. Revisit when a \
maintained serde-integrated YAML crate exists, or drop the test's YAML path entirely. \
Decided by Patrick on 9 October 2026.\
"""
decided_by = "Patrick"
look_again = 2027-04-09

[[release_age]]
dependency = "ajv-formats"
ecosystem = "npm"
reason = """
Finished, not abandoned, and first-party. It is the ajv project's own companion package \
(github.com/ajv-validator/ajv-formats) and the only way to get format assertions out of \
ajv 8, which contract/validate-examples.mjs needs. 140M downloads a week against ajv's \
391M, so better than one ajv user in three installs it. Not deprecated. It is CI-only: it \
validates the contract's examples and ships in nothing. There is no maintained \
alternative to move to, because there is nothing else that does this for ajv 8. \
Decided by Patrick on 9 October 2026.\
"""
decided_by = "Patrick"
look_again = 2027-10-08

# ---------------------------------------------------------------------------- advisories
#
# All seven are in `web/`, all seven are transitive, and none can be fixed from a direct
# dependency: `nuxt` and `mermaid` are both already at their newest published versions, so
# there is no in-range update that moves them.
#
# **Six of the seven are build-time only, and that is measured rather than asserted.** An
# earlier version of this comment called all seven "build-time tooling", which was wrong,
# and the wrong half was the one that mattered. `web/.output/public` was built from the
# committed lockfile with `pnpm run generate` - 6.3 MB, 189 files, exactly what the Rust
# binary embeds - and searched for each package by its own license banners, error strings
# and API symbols rather than by its name, because `braces` and `katex` both occur as
# ordinary English:
#
#   simple-git                absent
#   @simple-git/argv-parser   absent
#   node-forge                absent
#   braces                    absent - the one hit on the word is mermaid's own UI label,
#                             `shortName: "braces"`; micromatch, expand-brackets and
#                             fill-range are all absent, as is every braces API symbol
#   katex                     PRESENT - _nuxt/ZlcWpGUi.js, 258,685 bytes
#
# So `katex` ships. `MermaidFigure.vue` awaits `import('mermaid')` on mount and the mermaid
# chunk in turn awaits `import('./ZlcWpGUi.js')`, so katex is in the output and is fetched
# when a diagram contains maths. Its entry below is the one whose justification has to stand
# on what the code does, not on the package being absent - see the entry.
#
# The look-again date is short on purpose. These clear when upstream Nuxt and mermaid bump
# their own trees, which the weekly Dependabot pull request will bring in. If they are
# still here in December, that is a fact worth seeing rather than a list worth extending.

[[advisory]]
advisory = "GHSA-v5rq-49vh-5v5c"
dependency = "@simple-git/argv-parser"
ecosystem = "npm"
reason = """
nuxt > @nuxt/devtools > simple-git > @simple-git/argv-parser. Needs >=2.0.1; no in-range \
update reaches it because nuxt is already at its newest release. Devtools runs only under \
`nuxt dev` on a developer's own machine and is not in the static build the binary serves, \
so the unsafe-editor path is not reachable in the product. \
Verified absent from the static build. Decided by Patrick on 9 October 2026.\
"""
decided_by = "Patrick"
look_again = 2026-12-11

