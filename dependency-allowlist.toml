advisory = "GHSA-238p-pmpm-9mq7"
dependency = "katex"
ecosystem = "npm"
reason = """
katex IS in the shipped build - this is the one package of the seven that is, and an \
earlier version of this file wrongly implied otherwise. `_nuxt/ZlcWpGUi.js`, 258,685 bytes: \
`MermaidFigure.vue` awaits `import('mermaid')` on mount and the mermaid chunk in turn \
awaits `import('./ZlcWpGUi.js')`, so it is fetched when a diagram contains maths. Accepted \
anyway, on three grounds: the app is private and runs only on Patrick's own machine; the \
input is diagram source written by review sessions reading his colleagues' pull requests, \
so it is his own team's work rather than anything from outside; and the fix has to come \
from upstream mermaid, since mermaid 12.1.0 is already its newest release and nothing in \
range reaches katex >=0.18.2. No override is to be attempted. The advisory is rated low and \
is a prototype-pollution bypass of trust restrictions, and every rendered string goes \
through DOMPurify. Re-decided by Patrick on the corrected facts, 9 October 2026.\
"""
decided_by = "Patrick"
look_again = 2026-12-11
