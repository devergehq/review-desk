[[advisory]]
advisory = "GHSA-86w9-cpqp-85rv"
dependency = "node-forge"
ecosystem = "npm"
reason = """
nuxt > @nuxt/nitro-server > nitropack > listhen > node-forge. Needs >=1.4.1. listhen uses \
it to mint a self-signed certificate for `nuxt dev` over HTTPS, which this project never \
turns on, and none of it reaches the static build. Five levels deep in the Nuxt tree, so \
upstream owns the fix.\
"""
decided_by = "Patrick"
look_again = 2026-12-11

[[advisory]]
advisory = "GHSA-vfj7-8cjw-p6xm"
dependency = "braces"
ecosystem = "npm"
reason = """
nuxt > @nuxt/nitro-server > nitropack > globby > fast-glob > micromatch > braces. Needs \
>=3.0.4. A stack-exhaustion denial of service reachable only by feeding it a deeply nested \
glob pattern, and the only patterns it sees are the ones in this repository's own build \
configuration. Six levels deep; upstream owns the fix.\
"""
decided_by = "Patrick"
look_again = 2026-12-11

[[advisory]]
advisory = "GHSA-238p-pmpm-9mq7"
dependency = "katex"
ecosystem = "npm"
reason = """
mermaid > katex, needing >=0.18.2, and mermaid is already at its newest release so no \
