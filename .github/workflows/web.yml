# The dashboard's checks. Separate from ci.yml, which runs cargo: the two have no step in
# common, and a Rust change should not wait on a Node install to find out it compiles.
name: Web

# **Checks run once a pull request is ready.** The types below add `ready_for_review`,
# every job is gated on the pull request not being a draft, and `workflow_dispatch` keeps any
# branch checkable by hand. DEV-961; the README states the rule under "Build and test".
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'web/**'
      # The dashboard's types are generated from the contract and a test regenerates them
      # to compare, so a contract change can fail this workflow without touching `web/`.
      - 'contract/openapi.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Lint, types, tests and a static build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      # The action reads `packageManager` from a package.json, and `defaults.run` does
      # not apply to an action's inputs — so it has to be told where ours lives.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile so a dependency cannot change without the lockfile changing.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Types
        run: pnpm run typecheck

      # Before the tests, not after: `test/build-output.spec.ts` reads the build and
      # asserts that no fixture reached it, which is DEV-862's "a production build contains
      # no fixture data, shown by a test on the build output".
      - name: Build to static files
        run: pnpm run generate

      - name: Tests
        run: pnpm run test

      # `nuxt generate` succeeding is not the same as the output being servable. Two
      # routes are prerendered and the rest are the client router's: the Rust server
      # answers any path that cannot be a file with the index, which
      # `crates/server/tests/assets.rs` holds. Naming `/reviews/17` here would mean reading
      # a fixture at build time to find out which ids exist.
      - name: Every prerendered route resolves as a file
        run: |
          missing=0
          for route in index.html rules/index.html
          do
            if [ ! -f ".output/public/$route" ]; then
              echo "missing: $route"
              missing=1
            fi
          done
          exit $missing

      # The app is embedded in a binary and run from localhost. If the build asks a CDN
      # for a font or a script, it stops working on a machine with no internet.
      - name: Nothing is fetched from another origin
        run: |
          if grep -rlE '(href|src)="https?://' .output/public --include='*.html'; then
            echo "the generated HTML loads something from another origin"
            exit 1
          fi

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: web/.output/public
          retention-days: 7
