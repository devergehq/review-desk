openapi: 3.1.0

info:
  title: Review Desk local API
  version: 0.1.0
  summary: The JSON the local Rust server serves to the Review Desk dashboard.
  description: |
    Review Desk serves this API from a local binary, for one developer, on the loopback
    interface only. The dashboard in `web/` is its only client.

    Four rules hold everywhere in this document:

    - **Times are RFC 3339 in UTC**, with a `Z` offset. The store holds them as integer
      seconds since the Unix epoch; the server converts at this boundary.
    - **Identifiers from other systems are opaque strings.** The Allele session, the
      dispatcher ledger entry, the GitHub review and the Linear ticket are never parsed,
      validated or constructed by Review Desk.
    - **Errors share one shape**, `Error`, with a machine-readable `code` and a `message`.
    - **Nothing here posts to GitHub.** Approving a draft moves a status. The review
      session reads the approved draft and posts it.

    Review ids, finding sequence numbers and rule ids are Review Desk's own and are
    integers, matching the store in `crates/store/src/model.rs`.
  license:
    name: UNLICENSED
    url: https://github.com/devergehq/review-desk
  contact:
    name: Review Desk
    url: https://github.com/devergehq/review-desk

servers:
  - url: http://127.0.0.1:7777/api/v1
    description: |
      The local server binds 127.0.0.1 only. There is no authentication in this version;
      reachability is the authorisation. See contract/README.md.

tags:
  - name: inbox
    description: What is waiting on the developer.
  - name: review
    description: One review, its brief and its findings.
  - name: draft
    description: The draft review and its approval.
  - name: rules
    description: Rules and their stages.

paths:
  /inbox:
    get:
      operationId: getInbox
      tags: [inbox]
      summary: Everything waiting on the developer, grouped
      description: |
        Serves the whole Inbox screen in one call: the five waiting groups, the reviews in
        progress, the posted reviews waiting on their author, and the week's figures.
      responses:
        '200':
          description: The inbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inbox' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /repos:
    get:
      operationId: listRepos
      tags: [rules]
      summary: The repositories Review Desk holds a record for
      description: |
        Fills the repository picker on the Rules screen. A repository appears once it has
        either a review or a repository-scoped rule.
      responses:
        '200':
          description: The repositories, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: '#/components/schemas/RepoSummary' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews:
    get:
      operationId: listReviews
      tags: [review]
      summary: Every review on the record, newest first
      description: |
        **The one place every review is named, whatever became of it.** Every other read
        here is about a review that needs something: `GET /inbox` is what is waiting, and
        `GET /timings` is what has finished. A review that was posted and whose author has
        not replied appeared in neither, so until DEV-930 it was reachable only by typing
        its id.

        Newest first, by the order the reviews were opened. **Deliberately not by when
        they last changed**: `last_activity_at` is null for every review from before
        DEV-890, so sorting on it would place those in whatever order the database felt
        like. It is a column the list draws, not the one it is ordered by.

        **It describes and does not grade.** There is no score, no ranking and no figure
        about how well a review went; each row is where the review is and when it last
        moved. How long one took is `GET /timings`, which is a different question asked
        on purpose.

        **Unpaginated**, for the reason `GET /timings` is: this is one developer's own
        record on their own machine, and the read exists so that nothing is unreachable.
      parameters:
        - name: repo
          in: query
          required: false
          description: One repository, as `owner/repo`. Omit it for every repository.
          schema: { $ref: '#/components/schemas/RepoName' }
        - name: show
          in: query
          required: false
          description: |
            Which reviews to list. **Omitting it gives the ones in play**, which is the
            page's default view and the only safe default: a caller that has never heard
            of a dismissal or of a finish must not be handed a review that has left the
            desk.

            `dismissed` is the filter DEV-945 asks for — the reviews the developer
            dismissed, each saying when and why. `finished` is DEV-957's — the ones whose
            pull request merged or closed. `everything` is the whole record on one page. A
            value that is none of the four is refused by name rather than falling back to
            the default, because a mistyped filter answering with the default view would
            read as "there are no dismissed reviews".

            **It was `dismissed=excluded|only|included` until DEV-957.** That issue adds
            the fourth position, and `dismissed=finished` would have been a parameter whose
            name said the opposite of its value. Renamed rather than extended; nothing
            outside this dashboard reads it.
          schema: { $ref: '#/components/schemas/ReviewsShown' }
      responses:
        '200':
          description: Every review, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [repo, show, reviews]
                properties:
                  show:
                    $ref: '#/components/schemas/ReviewsShown'
                    description: |
                      The choice this answer was composed for, echoed back as `repo` is,
                      so the page's filter reads what it was given rather than trusting
                      its own state.
                  repo:
                    oneOf:
                      - $ref: '#/components/schemas/RepoName'
                      - type: 'null'
                    description: |
                      The repository asked about, echoed back, or null for every one — as
                      `GET /rules` echoes it. The page's filter reads it rather than
                      trusting its own state.
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewListItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreUnavailable'
    post:
      operationId: startReview
      tags: [review]
      summary: Start a review from a pull request link
      description: |
        Behind the Inbox's "Understand it first" button. Creates the review for the next
        round, or returns the existing review for that head commit, matching
        `review open` in DEV-851. No findings are written: the review starts at layer 2
        and waits for the developer to confirm the brief.

        **`head_sha` is optional, because the screen cannot supply one.** The Inbox has
        only a pasted link, so when `head_sha` is omitted the server reads the pull request
        from GitHub and stores what that read answers: the head commit, the title, and the
        changed-line count. A caller that already knows the head — the command line, or a
        review session — passes it and no read happens.

        **One read, three facts.** `title` and `changed_lines` are resolved by the same read
        as the head commit, and only for a caller that omitted them. A review on the screen
        would otherwise have no title to be listed under, which is what the Inbox and the
        One review screen show it by.

        The head is resolved **before the review is created, not afterwards**. A review
        with no head commit could not be deduplicated: the store finds an existing review
        by repository, number and head commit, so creating one headless would make a
        second review on the next click, and its round could not be assigned correctly.

        That read is a read. Nothing here writes to GitHub. If the read cannot be made —
        `gh` missing, not logged in, or the pull request unreachable — the request fails
        with `github_unavailable` and no review is created, rather than a review being
        created in a state nothing can complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartReviewRequest' }
      responses:
        '201':
          description: The review, new or already present.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: |
            The head commit was not supplied and could not be read from GitHub. No review
            was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getReview
      tags: [review]
      summary: One review whole, as the One review screen shows it
      description: |
        Serves the One review screen in one call: the review, its seven-layer status, the
        brief, every finding with its disposition, the outcomes recorded so far, what was
        not checked, and a pointer to the draft.
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreUnavailable'
    delete:
      operationId: deleteReview
      tags: [review]
      summary: Delete a review that never got past being requested
      description: |
        **Offered only for a review that holds nothing**, and refused for every other
        review with a message saying what it holds. Decided by Patrick on 12 October 2026:
        a review with findings carries the developer's sign-offs, the dispositions they
        made one at a time, and the evidence the rules in force were built from, so
        deleting it loses something real. Dismissal is the answer for everything else, and
        it keeps all of that.

        **Four things, and a review holding any one of them is refused**: a brief, a
        finding, a draft, and the review posted on GitHub. The fourth is the one the issue
        does not name, and it is not a fifth kind of work — it is `github_review_id`, set
        by `review link --github-review` for a review whose process ran outside Review
        Desk. Such a review holds none of the other three, and deleting it would remove
        the record that a review was posted on the pull request at all.

        What it is for is a row that should never have existed. The review this was raised
        from is one a build session wrote into the developer's real database by accident:
        `acme/portal #777`, never started, nothing under it, nothing to keep.

        **The review and every row that referenced it go**: its seven layer rows, the
        sources and ticket criteria its understanding was recorded from, its per-file
        change map, its description-lint results and its round commits. A rule that came
        from this review keeps its statement and loses the origin.

        **There is no command line path to this**, as there is none to confirming a brief
        or approving a draft. It is the developer's act, and a session that could reach it
        could delete the record of its own review.
      responses:
        '200':
          description: |
            The review as it was, which is the only copy left of it. A caller cannot read
            a row it has just removed, and the page has a line to draw about what went.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The review holds a brief, a finding, a draft, or the review it posted on
            GitHub, so deleting it would lose them. The message names what it holds and
            points at dismissal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: dismissReview
      tags: [review]
      summary: Take a review out of play, with a reason
      description: |
        **Hidden and kept.** The review leaves the queue, leaves the work list an agent
        reads — so no session is dispatched for it — and leaves the Reviews list's default
        view. Everything under it stays: its findings, their dispositions, its sign-offs,
        and the evidence the rules in force were built from.

        What it is for is a review the developer will not act on: a pull request closed
        unmerged, a duplicate, or a review request they decline. Decided by Patrick on
        12 October 2026 as the answer for every review, with `DELETE` kept for one that
        never started.

        **A reason is required**, as it is for a dismissed rule and for the same reason: a
        review hidden silently is one nobody can afterwards say why they hid. It is shown
        beside the review in the Reviews list's dismissed view.

        **Dismissing a dismissed review is refused** rather than quietly rewritten — the
        first dismissal is the one the developer made, and a second call would move its
        time and replace its words. Restore it and dismiss it again to change the reason.

        It is undone by `POST /reviews/{reviewId}/restore`, and that is the whole argument
        for preferring it to a delete: nothing about it is final.

        **There is no command line path to this.** The developer's act, in the dashboard,
        and nowhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissReviewRequest' }
      responses:
        '200':
          description: The dismissed review, carrying when and why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The review is already dismissed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/restore:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: restoreReview
      tags: [review]
      summary: Bring a dismissed review back
      description: |
        Clears the dismissal, and the review returns to the queue, the work list and the
        Reviews list's default view in whatever state it was in. Nothing under it changed
        while it was dismissed, so there is nothing to restore but the review itself.

        A review that is not dismissed is refused rather than answered: nothing would
        change, and a success for a request that did nothing is how a screen comes to show
        a button that appears to work.
      responses:
        '200':
          description: The review, no longer dismissed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The review is not dismissed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/brief/confirm:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: confirmBrief
      tags: [review]
      summary: Confirm the brief, releasing the layers behind it
      description: |
        The developer's act at layer 2. Sets `confirmed_at` and removes the review from
        the Inbox's "Confirm the problem" group. Confirming an already confirmed brief
        returns the brief unchanged rather than failing.
      responses:
        '200':
          description: The confirmed brief.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The review has no brief to confirm, or it is dismissed — a dismissed review is
            in no agent's work list, so confirming its brief would ask for a layer nothing
            will carry on past. Bring it back first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/brief/problem-statement:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getProblemStatement
      tags: [review]
      summary: The problem half of the brief, with nothing of the change in it
      description: |
        **The one read a session may hand to a blind pass.** It carries how the system
        works today, the before flow, and what was wrong with each numbered problem. That
        is the whole of it.

        Absent, and each for its own reason: `headline`, because it states the answer and
        is the one sentence that would anchor a fresh pair of eyes hardest; `flow_after`
        and every problem's `now_fixed`, because they *are* the change; each problem's
        named detail, because it is split before and after and the two sides travel
        together; the supporting table, the options with their verdicts, the blind pass,
        the parts, the open choices and the disagreements.

        The superseded `diagram` is absent too. One free-text field held the before and
        the after at once and nothing can separate them, which is why the flows are rows.

        `problem` is here because it is the problem half by name, and because it is the
        only thing a brief written the old way holds.

        **Review Desk runs no blind pass.** This read exists so a session can run one and
        record what it reported; see `Brief.blind_pass`.
      responses:
        '200':
          description: The problem half.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemStatement' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The review has no brief, so it has no problem statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/findings/{seq}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - name: seq
        in: path
        required: true
        description: The finding's sequence number within its review, from 1.
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      operationId: setFindingDisposition
      tags: [review]
      summary: Move a finding between the draft, held back and suppressed
      description: |
        A finding is never deleted. Holding it back or suppressing it records a reason,
        which is what lets a later rule proposal cite it.

        **The draft is recomposed with it**, because what the review posts changes: the
        finding's block stops composing, and its index row and its inline thread go with it.

        **A move that changes what posts is refused once the draft is approved** — `409`,
        as a decision is, because an approved draft is what the review session posts under
        the developer's name and it does not move underneath them. A move that cannot change
        it is not refused: a held-back finding moved to suppressed after the sign-off alters
        no character of the body, and the developer is entitled to tidy the list they are
        not posting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFindingDispositionRequest' }
      responses:
        '200':
          description: The finding as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The move would change what the review posts and the draft is already approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/findings/{seq}/decide:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - name: seq
        in: path
        required: true
        description: The finding's number, which is its identity across rounds.
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      operationId: decideFinding
      tags: [findings, draft]
      summary: The developer's decision about one finding, and the draft recomposed
      description: |
        Behind the decision track on a finding — Keep, Cut, Regrade, Rewrite — the three
        buttons on a held-back nit, and the replies to a carried finding in a later round.
        **Eight decisions behind eleven buttons**; `FindingDecision` has the table.

        Each decision is one transaction: the finding, its block of the body, the body
        itself and the outcome recording who decided are written together, and the
        draft's lint reads as **not checked** afterwards — never as passing, because the
        lint the agent ran was over a different body.

        **Only the developer decides.** The actor is not a parameter: it is `developer`,
        and the store refuses any other. Nothing in the command line agents call reaches
        the function behind this.

        Refused when the draft is `approved` or `posted` — an approved draft is what the
        review session posts under the developer's name — and refused with
        `no_draft_section` when the decision needs a block the draft has none of, which is
        every draft written as one block of markdown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideFindingRequest' }
      responses:
        '200':
          description: The finding, the outcome and the draft as recomposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingDecisionMade' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The draft is approved or posted, or it holds no block for this finding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/draft:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getDraft
      tags: [draft]
      summary: The draft body, its checks, the edits so far and the nits held back
      description: |
        Serves the Draft preview screen. `body` is GitHub-flavoured markdown and is what
        the review session will post verbatim; the dashboard renders it and never
        rewrites it.
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreUnavailable'
    put:
      operationId: saveDraft
      tags: [draft]
      summary: 'Save a draft: the blocks it is composed of, or one block of prose'
      description: |
        Replaces what the draft is made of. **Since DEV-877 a body is composed rather than
        written**: the caller sends the blocks — the summary sentence, a block per finding,
        the not-checked line, and whatever else the house style puts around them — and the
        body is what they compose to. A caller that sends only a body is writing the draft
        as one block, and the per-finding decisions then refuse, saying so.

        The developer's edits are recorded as outcomes against the findings they touched,
        which is the strongest signal in the feedback loop, so the caller states them
        rather than leaving them to be guessed from a text diff. A decision made through
        `decideFinding` records its own outcome and needs no `edits` entry.

        The lint is cleared: whatever it said was about the body before this one.

        Refused once the draft is `approved` or `posted`: an approved draft is what the
        review session reads, and editing it underneath would change what gets posted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDraftRequest' }
      responses:
        '200':
          description: The draft as saved, with its checks re-run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The draft is approved or posted and cannot be edited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/draft/approve:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: approveDraft
      tags: [draft]
      summary: Approve the draft and choose the event it is posted as
      description: |
        Behind "Approve and post". **This endpoint does not post.** It sets the draft's
        status to `approved`, stores the chosen event and `approved_at`, and stops. The
        review session discovers the approved draft and posts it to GitHub under the
        developer's name; it then reports back the GitHub review id through
        `review link --github-review` in DEV-851, which is what moves the status to
        `posted`.

        How the session learns of the approval is an open question in the project brief;
        nothing in this contract depends on the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveDraftRequest' }
      responses:
        '200':
          description: The approved draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The draft is not in a state that can be approved, or the review is dismissed —
            a dismissed review is in no agent's work list, so nothing would post it. Bring
            it back first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/draft/ticket-and-approve:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: ticketRestAndApprove
      tags: [draft]
      summary: File what is left as one ticket, and approve, in one step
      description: |
        Behind "Ticket what is left, and approve". **A sign-off, and it neither posts nor
        files anything.** Every finding the draft would have posted is held back for the
        ticket and recorded as `ticketed` this round by the developer, the review's one
        nit ticket moves to `requested`, the body is recomposed without those findings,
        and the draft is approved with the event `approve`.

        The event is not the caller's to choose: the button says approve, and a request
        for changes that ticketed everything it asked for would contradict itself.

        **The approval cannot link to the ticket, and the design says it does.** Review
        Desk files no ticket, so no ticket id exists at the moment of approval; only the
        session that files it can add that line. Recorded here rather than quietly
        dropped, as "Request review" is.

        `work list` on the command line reports the request as `nits_to_ticket` once the
        posting is done, and the approved draft carries the pending request until then, so
        the dispatcher sees both.

        Refused when the draft is not `ready`, and refused when the review has no open
        finding: there would be nothing to file, and nits already held back are asked for
        through `requestNitTicket` on their own.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketRestAndApproveRequest' }
      responses:
        '200':
          description: The approved draft, the ticket asked for, and what moved into it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketedAndApproved' }
        '400':
          description: |
            The request was understood and refused — most often because the review has no
            open finding to file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The draft is not in a state that can be approved, or the review is dismissed —
            a dismissed review is in no agent's work list, so nothing would post it. Bring
            it back first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/draft/send-back:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: sendBackDraft
      tags: [draft]
      summary: Send the draft back to the review session with a note
      description: |
        Behind "Send back with a note". Sets the status to `sent_back` and stores the
        note, which is the instruction the session reworks against.

        **A draft that is approved and not yet posted can be sent back too, and doing so
        takes the sign-off back**: the event, the time and whose assent it was are cleared,
        because the record should not hold a sign-off that has been withdrawn. It is the
        one transition out of `approved`, and it is the developer's — nothing here approves
        or posts anything, and a session still cannot reach either.

        Without it a draft the hand-over refuses had nowhere to go: it could not be sent
        back, could not be rewritten, and the only transition left was posting the body the
        refusal existed to stop. Measured by the DEV-929 worker half.

        A **posted** draft is not sent back. It is on GitHub, and what follows it is the
        next round rather than an edit of the last one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendBackDraftRequest' }
      responses:
        '200':
          description: The draft, sent back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The draft is drafting or posted: only one that is ready, or approved and not
            yet posted, can be sent back. Or the review is dismissed — a dismissed review
            is in no agent's work list, so nothing would revise it. Bring it back first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /reviews/{reviewId}/held-back/ticket:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: requestNitTicket
      tags: [draft]
      summary: Ask for one ticket covering the nits held back, or record the one filed
      description: |
        Behind "File as one ticket for an agent". Review Desk does not file Linear
        tickets, for the same reason it does not post to GitHub: it owns the record, not
        the outward action. Sent with no `ticket_id` it moves the request to `requested`
        for an agent to pick up; sent with one it records the ticket that was filed and
        moves to `filed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestNitTicketRequest' }
      responses:
        '200':
          description: The state of the ticket for this review's held-back nits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NitTicket' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            This review holds back no nits, or the review is dismissed **and this is the
            developer asking for a ticket** — a dismissed review is in no agent's work
            list, so nothing would file one. Bring it back first.

            Sending a `ticket_id` is a session reporting the ticket it has already filed,
            and that is accepted on a dismissed review: the ticket exists in the tracker,
            and refusing the report would leave the record never knowing which one it is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /timings:
    get:
      operationId: listReviewTimings
      tags: [review]
      summary: How long every finished review took
      description: |
        **One read, so statistics can be computed from it.** Every review whose draft has
        been posted, newest first, with the figures DEV-890 records: when it was requested,
        when the draft was ready, when it was signed off and posted, how long it was with
        the agent, how long it waited on the developer, and each of its seven steps with
        the passes it made.

        **There is no statistics page**, deliberately: this issue makes the numbers
        available and shows one review its own. Averages, charts and a window are
        somebody's later decision, and a server that had already picked them would have
        decided it.

        **Finished means posted.** A review the developer has not signed off yet has an
        open span and no total, so including it would mean serving a figure that grows
        every time the page is read. A review recorded before DEV-890 *is* here, with its
        figures null — leaving it out would quietly make "how long does a review take" a
        question about the reviews recorded since the change, which is a different
        question.
      parameters:
        - name: repo
          in: query
          required: false
          description: One repository, as `owner/repo`. Omit it for every repository.
          schema: { $ref: '#/components/schemas/RepoName' }
      responses:
        '200':
          description: |
            The finished reviews and their timings, newest first.

            **Unpaginated, deliberately.** This is one developer's own record on their own
            machine, and the read exists so that every finished review can be counted;
            answering with a page would make a count of "how long does a review take" a
            count of the last page of them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewTimingRow' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: Rules for a repository, by stage, with the week's figures
      description: |
        Serves the Rules screen. With `repo` set, returns that repository's rules and
        every global rule, matching `rules list --repo` in DEV-851. Without it, returns
        every rule in every scope, which is the picker's "All repositories".

        Unlike the command line, this includes `proposed` and `retired` rules: the
        screen's whole purpose is deciding on them.
      parameters:
        - name: repo
          in: query
          required: false
          description: A repository as `owner/repo`. Omitted means every repository.
          schema: { $ref: '#/components/schemas/RepoName' }
      responses:
        '200':
          description: The rules and the summary figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /rules/{ruleId}/promote:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      operationId: promoteRule
      tags: [rules]
      summary: Promote a rule one stage along
      description: |
        A rule graduates observation to repository rule to lint check to CI check. The
        developer promotes; **the app never promotes a rule itself.** `to_stage` is
        stated by the caller rather than inferred, so an accidental double click cannot
        skip a stage silently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRuleRequest' }
      responses:
        '200':
          description: The rule at its new stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That stage does not follow the rule's current stage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /rules/{ruleId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      operationId: dismissRule
      tags: [rules]
      summary: Dismiss a proposed rule
      description: |
        Rejects a proposal. The rule moves to `retired` with the reason recorded, rather
        than being deleted, so the harvester does not propose it again next week with no
        memory of having been told no.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleReasonRequest' }
      responses:
        '200':
          description: The dismissed rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /rules/{ruleId}/retire:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      operationId: retireRule
      tags: [rules]
      summary: Retire a rule that has gone stale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleReasonRequest' }
      responses:
        '200':
          description: The retired rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreUnavailable'

  /rules/{ruleId}/defer:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      operationId: deferRule
      tags: [rules]
      summary: Keep a stale rule for a further period
      description: |
        Behind "Keep 60 more days". Sets `review_again_at`, which is what takes the rule
        out of the stale group without pretending a finding cited it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeferRuleRequest' }
      responses:
        '200':
          description: The rule, with its next review date set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StoreUnavailable'

components:

  parameters:
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: Review Desk's own review id.
      schema: { type: integer, format: int64, minimum: 1 }
    RuleId:
      name: ruleId
      in: path
      required: true
      description: Review Desk's own rule id.
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    BadRequest:
      description: The request was understood and refused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such review, finding, draft or rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StoreUnavailable:
      description: |
        Review Desk could not run: the database is unreadable or a migration failed.
        This is the HTTP equivalent of exit code 2 in DEV-851, and a caller must be able
        to tell it from a refusal without reading the message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      description: |
        The one error shape. `code` is for the client to branch on and never changes
        wording; `message` is for a person and may change freely.
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          minLength: 1
          description: One sentence, for a person.
        field:
          type: [string, 'null']
          description: The field at fault, when one value caused the refusal.
        expected:
          type: [string, 'null']
          description: |
            The accepted values, comma separated, when `code` is `invalid_value`. A
            caller that rejects input has to say what it would have accepted.

    ErrorCode:
      type: string
      description: |
        `store_unavailable` means Review Desk is broken and the caller should warn
        loudly. `github_unavailable` means a read Review Desk needed could not be made —
        `gh` missing or not logged in — which is the developer's environment rather than
        their request. Every other code means the request was understood and refused.
      enum:
        - bad_request
        - invalid_value
        - not_found
        - conflict
        - github_unavailable
        - store_unavailable

    RepoName:
      type: string
      pattern: '^([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)/([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$'
      examples: ['acme/portal']
      description: |
        A repository as `owner/repo`. The join key, with the head commit.

        **Neither half may be `.` or `..`**, which the character class alone permits — `.`
        is legal *in* a name, and the class says nothing about what a segment means. Three
        dots are a legal name and are accepted; only those two exact segments are not.

        The exclusion is load-bearing because the value is read back out and put into paths:
        `gh api repos/{repo}/pulls/{pr}`, where `repos/../../pulls/1` is
        `api.github.com/pulls/1`, and `https://github.com/{repo}/pull/{pr}`, which a browser
        resolves to `github.com/pull/1`. In both the value goes somewhere other than the
        repository anybody named.

        **Written without lookahead on purpose.** The three alternatives per half say "in
        the class, and not exactly `.` or `..`" the long way round, because a `(?!…)` here
        is outside the subset JSON Schema recommends for `pattern`: every consumer in this
        repository copes — ajv is JavaScript's own `RegExp` and the Rust validator uses
        `fancy-regex` — but a client generated from this document against RE2 or Rust's
        `regex` fails to *compile* the schema rather than ignoring the constraint. A
        published contract has to be readable by a validator nobody here chose.

        **This governs responses as well as requests**, and the two are not symmetrical. A
        request carrying `../..` is refused with `invalid_value`. A *row* carrying it can
        exist — a released Review Desk never checked, and the column cannot be repaired,
        because `repo` is identity: half of a review's unique key and the join to a
        repository's rules, so rewriting it would merge or split reviews rather than mend
        them. `GET /reviews` over such a database therefore serves a body that fails this
        schema. Said here rather than left for a reader to find: the honest reading is that
        the pattern describes what this server will accept and what a sound database holds,
        and a client should treat a repository name it cannot parse as unlinkable rather
        than as impossible.

    ForeignId:
      type: [string, 'null']
      minLength: 1
      description: |
        An identifier owned by another system — an Allele session, a dispatcher ledger
        entry, a GitHub review, a Linear ticket. Opaque: Review Desk stores and returns
        it and never parses it.

        **Two exceptions, and they differ from each other**, both on a ticket id:

        | Where | What happens to `" ABC-231 "` | What happens to `" "` |
        |---|---|---|
        | `Review.ticket_id` | stored as `ABC-231` | read as **absent**: a stored id is left alone |
        | `nit_ticket_id`, through `requestNitTicket` | stored as `ABC-231` | **refused** with `invalid_value` |

        The two are not inconsistent, they are different acts. A review's facts are
        optional and "left out" has to mean "leave it as it was", or `--ticket ""` from an
        unset shell variable wipes a recorded id. Asking for a nit ticket, by contrast, is
        a report that a specific ticket was filed — there is no form of it that reports a
        filing nobody made, so a blank id there is a mistake rather than a field left out.

        Every other `ForeignId` — `session_id`, `ledger_id`, `github_review_id` — is stored
        and returned exactly as given.

        A review's ticket is a fact about *that round*. Round 2 of a pull request does not
        inherit round 1's, any more than it inherits its title or its changed-line count —
        a caller passes what it knows on each `POST /reviews`.

    TicketUrl:
      type: [string, 'null']
      pattern: '^https://'
      examples: ['https://linear.app/acme/issue/ABC-231']
      description: |
        Where a ticket is — the address the calling session was given, beside the opaque
        `ticket_id` it goes with.

        **Given, never derived, and never fetched.** A `ForeignId` is opaque by rule, and
        turning `ABC-231` into an address needs the tracker and the workspace, which the
        session knows from its dispatch and Review Desk does not. So this is an address
        somebody passed or it is null; Review Desk reads nothing from it and asks the
        tracker nothing.

        **`https` only, and refused on the way in.** The one thing a stored address is for
        is being drawn as a link, so a `javascript:` or `data:` value in an `href` is the
        whole of the risk. A request carrying anything else is refused with
        `invalid_value`, naming `ticket_url`. `http` is refused with the rest: nothing here
        reads the address, so there is no case where the insecure form is the only one
        available.

        **A client draws the ticket's `ticket_id` as the link's text, never the address** —
        a link whose text is a URL is a link a reader has to parse. Which is why an address
        with **no id** is refused too, with `invalid_value` naming `ticket_id`: nothing
        would ever draw it, and a value that reaches no screen is a silent no-op. The id
        may arrive in the same request or already be on the record.

    Severity:
      type: string
      enum: [blocker, should, nit, question]
    Disposition:
      type: string
      enum: [in_draft, held_back, suppressed]
    DraftSectionKind:
      type: string
      description: |
        What one block of a draft body is. `prose` is markdown carried through exactly as
        written; `finding` is a heading the server composes from the finding's severity,
        its number and the block's title, followed by the block's text.

        The division is the whole of the composition: `finding` is the part a decision
        changes, and `prose` is everything else — the summary sentence, the not-checked
        line, an index, a method line, a folded proof — which is what lets an assembled
        body reproduce what an agent wrote character for character.
      enum: [prose, finding]
    FindingDecision:
      type: string
      description: |
        What the developer decided about one finding.

        **Eight decisions behind the designs' eleven buttons**, and the collapsing is
        deliberate: the same decision is labelled differently depending on where it is
        drawn, and two wire values for one act would be two things to keep in step for
        ever.

        | Button | Value | The body | Disposition | Round status | Outcome |
        | -- | -- | -- | -- | -- | -- |
        | Keep · Post it | `keep` | its block posts, written if it had none | `in_draft` | unchanged | `kept` |
        | Cut · Drop | `cut` | its block stops posting | `suppressed` | unchanged | `cut` |
        | Regrade | `regrade` | its heading changes | unchanged | unchanged | `regraded` |
        | Rewrite | `rewrite` | its title and paragraph change | unchanged | unchanged | `rewritten` |
        | To a ticket · Move to a ticket | `to_ticket` | its block stops posting | `held_back` | `ticketed` | `ticketed` |
        | Raise it again | `raise_again` | its block posts | `in_draft` | `still_open` | `raised_again` |
        | Accept their reason | `accept_reason` | its block stops posting | `suppressed` | `accepted` | `rejected` |
        | Withdraw | `withdraw` | its block stops posting | `suppressed` | `withdrawn` | `withdrawn` |

        A round status a decision changes is recorded as decided by `developer`, and the
        outcome's actor is `developer`. Only the developer decides, and the command line
        agents call has no command for any of it.
      enum:
        - keep
        - cut
        - regrade
        - rewrite
        - to_ticket
        - raise_again
        - accept_reason
        - withdraw
    OutcomeKind:
      type: string
      description: |
        The same closed set as `OutcomeKind` in `crates/store/src/model.rs`, with the same
        wire strings.

        `replied` and `thread_resolved` are what the harvester records, and they were
        missing here until DEV-861. The harvester merged before this contract was written
        against it: it writes both kinds today, so a conforming server reading a review
        out of the store would have had to drop them, and the Inbox's "Author replied"
        group is built from exactly those rows.

        **`replied` is deliberately not `accepted` or `rejected`.** Reading what a reply
        meant needs judgement, and the harvester is deterministic — it stores the reply as
        written and leaves the reading to a person or an agent. A client that wants
        "rejected with a reason" uses `rejected`, which only a person records.

        **`ticketed` and `withdrawn` were added by DEV-877**, which made the developer's
        decisions real actions: each of the eight leaves exactly one outcome, and
        overloading `cut` for "moved to a ticket" and "no longer stands" would lose the
        distinction the feedback loop exists to draw. The first eight are the developer's
        and the last three the harvester's.

        **Accepting the author's reason is recorded as `rejected`, with the reason as the
        detail.** That is what `RuleCounts.rejected_with_reason` counts — "author
        disagreed once, with a reason you accepted" — so it has to be that kind rather
        than one of its own that nothing would read.
      enum:
        - cut
        - regraded
        - rewritten
        - kept
        - rejected
        - ticketed
        - withdrawn
        - raised_again
        - replied
        - thread_resolved
        - code_changed_after
    Actor:
      type: string
      enum: [developer, author, harvester]
    RuleStage:
      type: string
      description: |
        A rule's graduation. `active` is a repository or global rule applied by a review;
        `lint` and `ci` are checked without a model.
      enum: [proposed, active, lint, ci, retired]
    DraftStatus:
      type: string
      description: |
        `drafting` while the session is writing; `ready` once it is waiting on the
        developer; `approved` once the developer has approved it and before the session
        posts; `sent_back` when the developer returned it with a note; `posted` once the
        GitHub review id is recorded.
      enum: [drafting, ready, approved, sent_back, posted]
    ReviewEvent:
      type: string
      description: The GitHub review event the approved draft is to be posted as.
      enum: [comment, request_changes, approve]
    PrState:
      type: string
      description: |
        What a pull request was last seen to be, **at the last harvest and not now**.
        Review Desk reads GitHub once — `POST /reviews`, to resolve a head commit — and
        `review-desk harvest` is what writes this; nothing here polls GitHub to keep it
        fresh.

        Null, wherever this appears, is the harvester never having looked. That is not
        `open`: it is nothing known, and a screen says so rather than assuming a pull
        request is still going.
      enum: [open, merged, closed]
    HunkLineMarker:
      type: string
      description: |
        What the pull request did to one line of a finding's hunk.

        Words, not `+`, `-` and a space. The marker is a fact about the line; which
        character draws it is the dashboard's business, and the approved design draws a
        removal as `−`, which is not the character a diff uses.
      enum: [added, removed, unchanged]
    FindingVerification:
      type: string
      description: |
        Whether a finding's proof was reproduced or only read.

        **`unknown` is the default and it is the honest one.** An agent that said nothing
        has not said the finding was read rather than run; it has said nothing. The
        dashboard badges `reproduced` and shows no badge for the other two, so a server
        that defaulted to `read_not_run` would put a claim about the method on every
        finding written before this field existed.

        Not in `Finding.required`, which is this document's convention for every field a
        finding may lack — `file`, `line` and `evidence` are the same. A server serving
        this contract writes the field on every finding; a client reading a document
        written before it existed reads an absent value as `unknown`, which is what it
        means.
      enum: [reproduced, read_not_run, unknown]

    RepoSummary:
      type: object
      additionalProperties: false
      required: [repo, open_reviews, active_rules]
      properties:
        repo: { $ref: '#/components/schemas/RepoName' }
        open_reviews:
          type: integer
          minimum: 0
          description: Reviews on this repository not yet posted.
        active_rules:
          type: integer
          minimum: 0
          description: Rules at stage `active`, `lint` or `ci` scoped to this repository.

    Review:
      type: object
      additionalProperties: false
      required:
        [id, repo, pr, head_sha, round, created_at, pr_state, pr_state_at, harvested_at,
         ticket_url, dismissed_at, dismissed_reason]
      description: One review of one pull request at one head commit.
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        repo: { $ref: '#/components/schemas/RepoName' }
        pr:
          type: integer
          format: int64
          minimum: 1
          description: The pull request number.
        head_sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
          description: The head commit reviewed, full or abbreviated.
        round:
          type: integer
          format: int64
          minimum: 1
          description: Which round of review this is on that pull request, from 1.
        title:
          type: [string, 'null']
          description: |
            The pull request's title, as the caller supplied it — or, for a caller that
            supplied none, as `POST /reviews` resolved it from the pull request.
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: |
            The ticket the change is for, opaque.

            **Trimmed on the way in, and a blank one is read as absent**, which is the one
            exception to `ForeignId`'s round-trip: `" ABC-231 "` is stored and returned as
            `ABC-231`.

            **Absent means "leave it as it was", not "clear it".** A whitespace-only id —
            `" "`; the empty string is already refused by `minLength` above — does not null
            a stored one. The write is `COALESCE(?, ticket_id)`, which only a `NULL` tells
            to leave the column alone, so reading blank as absent is exactly what stops
            `--ticket ""` on the command line, where no schema applies, from wiping a
            recorded `ABC-231`. On a review being created there is nothing to leave, so it
            simply has no ticket. A request whose only field is a blank id writes nothing at
            all, and does not even mark the review as written to.

            It exists because this id is checked against `ticket_url` — an address beside a
            blank id would reach no screen — and a field read one way by a check and another
            by a writer is what let that fault through twice. The other `ForeignId`s on this
            object are untouched.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is. **Null is a review nobody passed an address for**, which
            is every review opened before the field existed — and a client then draws
            `ticket_id` as text rather than as a link. Nothing derives it from the id.

            **Required, for the reason `pr_state` below is**, and it is the same reason
            read twice. The convention here has been to leave a new field out of
            `required`, so that a response written before it existed is missing it rather
            than wrong. Optional, every check passes while the server, the examples and
            the dashboard's sample records hold three different answers: the example
            validator skips a field the example omits, the store's example test walks the
            example's fields, and the generated type becomes `ticket_url?` so a fixture
            without it is not a type error. The one thing this field does is decide
            whether the header draws a link, so a silently absent one is a feature that
            quietly is not there. Required, all three fail loudly.
        changed_lines:
          type: [integer, 'null']
          minimum: 0
          description: |
            Additions plus deletions, as the caller supplied it — or, for a caller that
            supplied none, as `POST /reviews` resolved it from the pull request.
        session_id: { $ref: '#/components/schemas/ForeignId' }
        ledger_id: { $ref: '#/components/schemas/ForeignId' }
        github_review_id: { $ref: '#/components/schemas/ForeignId' }
        created_at: { type: string, format: date-time }

        # -- what the harvester last saw (DEV-930) -----------------------------------
        #
        # Served here rather than on the one item that needed them, because they are
        # columns of the review either way — and because the dashboard's sample records
        # are built out of `ReviewDetail`, so an inbox group that knew them and the
        # review that did not would have been two answers to one question.
        pr_state:
          oneOf:
            - $ref: '#/components/schemas/PrState'
            - type: 'null'
          description: |
            What the pull request was last seen to be. Null is the harvester never
            having looked, which is every review until `review-desk harvest` has run
            over it.

            **Required, unlike the other fields added late to this document.** The
            convention here has been to leave a new field out of `required`, so that a
            response written before it existed is missing it rather than wrong — and
            that convention is exactly what would have let this one drift unseen.
            Optional, every check passes while the server, the examples and the
            dashboard's sample records hold three different answers: the example
            validator skips a field the example omits, the store's example test walks
            the *example's* fields, and the generated type becomes `pr_state?` so a
            fixture without it is not even a type error. Required, all three fail
            loudly. The reverse direction was already caught — the conformance test
            asserts `additionalProperties: false` rejects a field this document does
            not declare — and the asymmetry was entirely in `required`.
        harvested_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the harvester last read this review's outcomes back from GitHub.
            **Null is what makes every figure about the author unmeasured** — see
            `InboxPostedItem`, whose three counts are null exactly when this is.

            `pr_state_at` beside it is when the pull request reached that state, and it
            had no reader until DEV-957. It has one now: the draft page of a finished
            review says "Not posted — the pull request merged on 11 October 2026", and
            nothing else can date that sentence.

        pr_state_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the pull request reached `pr_state` — merged at, or closed at — and null
            while it is open or while nothing has looked. **Null is also a settled pull
            request GitHub gave no time for**, and a reader must then say it merged
            without naming the day rather than invent one.

            It is a fact about the pull request and the record keeps a copy per round:
            only the round a harvest read gets its copy written. So a reader asking
            whether the *pull request* has finished must not read one round's column —
            `GET /reviews` answers that for a whole row in `left_the_desk`, and
            `GET /reviews/{reviewId}/draft` answers it for one review in
            `not_for_signing`.

        # -- the dismissal (DEV-945) -------------------------------------------------
        #
        # On the review rather than on the list item, because every screen that can draw
        # a review has to be able to say it is dismissed: the page it is dismissed from
        # reads `GET /reviews/{reviewId}`, and the list reads `GET /reviews`.
        #
        # **Both required**, for the argument `pr_state` makes above: a field left out of
        # `required` passes every check while the server, the examples and the dashboard's
        # sample records hold three different answers about it, because the example
        # validator skips what an example omits and the generated type becomes optional.
        dismissed_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the developer dismissed this review, or null while it is in play. A
            dismissed review is out of the queue, out of the work list an agent reads and
            out of the Reviews list's default view, and everything under it is kept.
        dismissed_reason:
          type: [string, 'null']
          minLength: 1
          description: |
            Why it was dismissed, in the developer's own words. Null exactly when
            `dismissed_at` is null: a dismissal with no reason is refused, because a
            review hidden silently is one nobody can afterwards say why they hid.

    StartReviewRequest:
      type: object
      additionalProperties: false
      required: [pr_url]
      description: |
        Only the link is required. Every other field is an optimisation: a caller that
        already knows a value passes it and saves the server a read.
      properties:
        pr_url:
          type: string
          format: uri
          description: |
            The pull request link the developer pasted. The server parses `owner/repo`
            and the number out of it.
          examples: ['https://github.com/acme/portal/pull/412']
        head_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{7,40}$'
          description: |
            The head commit to review. **Omit it and the server resolves it from the pull
            request**, which is what the Inbox screen does. Pass it to review one
            specific commit, which is what the command line does.
        title:
          type: [string, 'null']
          description: |
            Resolved by the same read as the head commit when omitted. Pass it to record a
            title of your own, which nothing then overwrites.
        ticket_id: { $ref: '#/components/schemas/ForeignId' }
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is. **Not resolved when omitted**, unlike the head commit,
            the title and the changed-line count: nothing fetches a tracker and GitHub does
            not know which ticket a pull request is for. Pass it or the review has none.

            Sent with no `ticket_id`, and none already on the record, it is refused with
            `invalid_value` naming `ticket_id` — see `TicketUrl`. A refused request opens
            no review and spends no round.

            **A `ticket_id` that differs from the one held clears a stored `ticket_url`**
            unless the same request gives a new one. That is the single exception to this
            operation's "a fact you pass is written, a fact you omit is left as it was": an
            address belongs to one ticket, and kept against a different id a client draws a
            link whose text and destination name two different things. Pass both to move
            both. There is no way to clear an address and keep the id.
        changed_lines:
          type: [integer, 'null']
          minimum: 0
          description: Resolved by the same read as the head commit when omitted.

    ReviewLayerName:
      type: string
      description: The seven layers of a review, in order.
      enum: [lint, understand, alternatives, solution_map, code_review, draft, harvest]

    ReviewLayerState:
      type: string
      description: |
        `waiting_on_you` is the developer's turn and is what the Inbox groups on.
        `pending` has not started. `failed` is a layer that ran and did not pass, which
        only `lint` can currently be.
      enum: [pending, running, done, waiting_on_you, failed, skipped]

    ReviewLayer:
      type: object
      additionalProperties: false
      required: [number, name, state]
      properties:
        number: { type: integer, minimum: 1, maximum: 7 }
        name: { $ref: '#/components/schemas/ReviewLayerName' }
        state: { $ref: '#/components/schemas/ReviewLayerState' }
        detail:
          type: [string, 'null']
          description: |
            The short phrase the screen shows after the layer's name — "passed",
            "confirmed by you", "3 options", "6 findings". Written by the layer that ran;
            not derived, so a skipped layer cannot be mistaken for a finished one.
        updated_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the layer was last written. **Overwritten on every write**, which is why
            `runs` exists: this one time could not say when the layer started.

        # -- how long this step took (DEV-890) ---------------------------------------
        runs:
          type: array
          items: { $ref: '#/components/schemas/ReviewLayerRun' }
          description: |
            Every pass this step has made, oldest first — **a step that ran twice reports
            both**. Derived from the store's append-only record of the states the step
            entered, so a total and the times it came from cannot disagree.

            Empty for a step nothing has written. Always served by this server; a response
            written before DEV-890 is missing it rather than wrong, which is why it is not
            required here.
        seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            How long this step took in total, in whole seconds, over every pass it made —
            the developer's own waits included. The split between the agent's time and the
            developer's is `ReviewTimings`, which does not fold it in here.

            **Null is not zero.** It means no pass of this step has both a start and a
            finish on the record, which is every finished step of a review from before
            DEV-890. A pass still going is left out of the total: a figure that grew on
            every reload would not be an answer to how long the step took.

            Whole seconds, never formatted text — how to say "17 min" is the screen's
            decision and the store holds no opinion about it.

        # -- what the step came to, as pairs (DEV-917) -------------------------------
        facts:
          type: array
          items: { $ref: '#/components/schemas/LayerFact' }
          description: |
            What this step came to, as short pairs, in the order the session wrote them —
            **what `detail` is a one-line summary of**. The trail draws `detail` on one
            line and opens these on a card anchored to the step.

            Empty for a step that recorded none, and a step with none draws no card and
            no control for one — except step 7 while it is `running`, which draws a card
            for `updated_at`, the moment the step was last written. That is when a harvest
            last read the review, whoever wrote it. Not required here, for the reason
            `runs` is not: a response written before DEV-917 is missing it rather than
            wrong.

    LayerFact:
      type: object
      additionalProperties: false
      required: [label, value]
      description: |
        One fact a step recorded — a label and a value, both short.

        **This is what the step's note was trying to be.** Before DEV-917 a step printed
        its whole `detail` in a column about 150 pixels wide, eleven lines deep on a real
        review; a pair is the shape that fits a card's two columns and a sentence is not.

        Neither half is derived and neither is checked. Review Desk counts nothing here to
        agree or disagree with.
      properties:
        label:
          type: string
          minLength: 1
          description: The left column — "Problems", "Held for a ticket", "Blockers".
        value:
          type: string
          minLength: 1
          description: >-
            The right column — "3", "6: 4 should, 1 question, 1 nit", "none; the second
            reader agrees".

    ReviewLayerRun:
      type: object
      additionalProperties: false
      required: [state, started_at, ended_as, finished_at, seconds]
      description: |
        One pass a step made: what it was doing, when that began, and what ended it.

        **A pass is one continuous occupancy of one working state**, so a draft that was
        written, sent back and written again is two passes at `running` with the
        developer's own wait between them.

        Both halves are nullable, and each null says something different:

        | Shape | What it means |
        |---|---|
        | start and finish | a pass that is over, and its length is known |
        | start, no finish | the pass going on now |
        | finish, no start | a step finished before anything recorded a start — every finished step of a review from before DEV-890 |
      properties:
        state:
          oneOf:
            - $ref: '#/components/schemas/ReviewLayerState'
            - type: 'null'
          description: |
            What the step was doing: `running` for the agent's own work,
            `waiting_on_you` for the developer's turn. Null when the start was never
            recorded, in which case nothing says which of the two it was.
        started_at:
          type: [string, 'null']
          format: date-time
        ended_as:
          oneOf:
            - $ref: '#/components/schemas/ReviewLayerState'
            - type: 'null'
          description: |
            The state the step moved to, which is what ended the pass. Null while the pass
            is still going.
        finished_at:
          type: [string, 'null']
          format: date-time
        seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            How long the pass took, in whole seconds. Null when either end is missing —
            never zero for a pass nothing measured.
        detail:
          type: [string, 'null']
          description: |
            What was written against the state this pass was in — "waiting on you", or the
            developer's own instruction back. Null when none was written, or when the start
            was not recorded.

    ReviewTimings:
      type: object
      additionalProperties: false
      required:
        - requested_at
        - draft_ready_at
        - signed_off_at
        - posted_at
        - with_the_agent_seconds
        - waiting_on_you_seconds
        - last_activity_at
      description: |
        How long one review took, as the four questions DEV-890 exists to answer. The
        per-step figures are not here: they are on `layers[]`, with the passes they were
        computed from, because a page that could render the same fact from two lists could
        render a disagreement.

        **Every duration is whole seconds and every one is nullable.** A figure the record
        cannot answer is absent; it is never a nought, which for a review recorded before
        DEV-890 would say it took no time at all.
      properties:
        requested_at:
          type: string
          format: date-time
          description: |
            When the review was asked for — the review's own `created_at`, which is the
            developer starting it or a session opening it.
        draft_ready_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the draft was last ready for the developer: step 6 entering
            `waiting_on_you`. **The last time rather than the first** — a draft sent back
            and redrafted is ready again, and the one that matters is the one the developer
            was last shown.
        signed_off_at:
          type: [string, 'null']
          format: date-time
          description: The draft's `approved_at`. Only the developer signs off.
        posted_at:
          type: [string, 'null']
          format: date-time
          description: |
            When a session reported the review posted. A review with a time here is
            finished, and is what `GET /timings` lists.
        with_the_agent_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            Requested to draft ready, less the developer's own time inside that span.

            **The overlap, not the waits that finished.** A session may draft before the
            brief is confirmed — `blocks_later_layers` exists to say whether it did — so a
            wait on the developer can still be open when the draft becomes ready. Its own
            length is unknown; the part of it that fell inside this span is not.

            Null until the draft is ready: there is no end to measure to, and measuring to
            now would make a figure that grows while nothing happens.
        waiting_on_you_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            How long the review waited on the developer, over every step and every pass:
            brief ready to confirmed, and draft ready to signed off. Null when no wait has
            finished — which is not the same as a review nobody has been waiting on, and
            the screen says which.

            **This and `with_the_agent_seconds` do not add up to `draft_ready_at` minus
            `requested_at`, and that is not an error.** They answer two different
            questions. This one counts waits that have *ended*, because a wait still going
            has no length. The other subtracts the developer's time *inside one span*,
            where a wait still going does have one — it ran to the moment the draft was
            ready. A review whose brief is still unconfirmed while its draft is ready
            shows exactly that gap: the open wait is in the one figure and not in the
            other.
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: |
            When anything last wrote to this review. **Every write moves it and no read
            does**, so it is how long a session has been silent — the nearest thing Review
            Desk can say about whether one is alive, because Allele owns that and tells
            this server nothing.

            Null for a review nothing has written to since the record started keeping
            this, which is every review from before DEV-890 and is not the same answer as
            a long time ago.

    ReviewTimingRow:
      type: object
      additionalProperties: false
      required: [review, timings, layers]
      description: One finished review's timings, as a row of `GET /timings`.
      properties:
        review: { $ref: '#/components/schemas/Review' }
        timings: { $ref: '#/components/schemas/ReviewTimings' }
        layers:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/ReviewLayer' }
          description: |
            All seven steps, in order, each with its passes and its total — so a per-step
            figure can be computed from this one read.

    ReviewListItem:
      type: object
      additionalProperties: false
      required:
        [review, rounds_on_pr, steps_total, last_activity_at, left_the_desk, finished_how,
         finished_at]
      description: |
        One row of `GET /reviews`: the review, the step it has reached, whether it has left
        the desk, and when it last moved.

        **The step is the furthest one that has started**, which is to say the
        highest-numbered of the seven whose state is not `pending`. `step_number` and the
        two fields with it are absent together, for a review nothing has reported on at
        all — which is not the same as the lint being pending, and the row says so in
        words rather than drawing a 1.

        Deliberately *not* a `ReviewLayer`: that carries every pass a step made and every
        fact it recorded, and a list of the whole record would be reading a statement per
        step per review to fill them. The one review screen is where a step opens up.

        **A screen must draw `step_state` or `step_detail` and never the name alone.**
        When the furthest started step is finished, its name is the step the review has
        *left*: a posted review's is `draft`, and a cell reading "Draft" tells a reader it
        still needs signing off while the queue says it is with the author. "Draft,
        approved by you" says the same record and misleads nobody.

        **A harvest writes step 7 for a review it was posted on, so that review reports
        it.** `draft posted` writes the step `pending`, and from DEV-933 `review-desk
        harvest` writes what it found there: `running` while the pull request is open,
        `done` once it has merged or closed. A client must draw `harvest` here.

        **A `harvested_at` does not by itself mean step 7, and the example beside this
        schema is such a record.** Two ways a review holds the stamp without the step.
        One: it was read before DEV-933, when nothing in the harvest path wrote a step, so
        a harvested review reported whatever step a session had written — which for the
        example's review 12, posted and read back, is `draft`.

        Two: the harvest reads every review whose pull request is open, including one
        still being drafted, and writes the step only where the record holds a
        `github_review_id` — a step saying a feedback loop is running on a review nobody
        posted would be a lie.

        So a client draws the step the record holds and infers nothing from the stamp.

        A *session* may write it too — `review-desk layer set` writes any step to any
        state, and the example beside this schema carries a review whose step 7 is `done`.
        What this document will not do is derive one from `Review.harvested_at`: a derived
        state is an invented one, and the two are written together anyway.
      properties:
        review: { $ref: '#/components/schemas/Review' }
        rounds_on_pr:
          type: integer
          format: int64
          minimum: 1
          description: |
            The highest round this pull request has reached, so the row reads "round 1 of
            3". **A bare round number is not safe in a column of its own**: beside the
            repository and the pull request it reads as a count of rework against the
            author named next to it. As one of a total it is a position in a sequence.
        step_number:
          type: integer
          minimum: 1
          maximum: 7
          description: |
            Which of the seven the review has reached. Absent when every step is still
            `pending`.
        step_name: { $ref: '#/components/schemas/ReviewLayerName' }
        step_state: { $ref: '#/components/schemas/ReviewLayerState' }
        step_detail:
          type: [string, 'null']
          description: |
            The short phrase written against that step — "passed", "3 options", "waiting
            on you". Written by the step that ran; never derived, so a skipped step
            cannot read as a finished one.
        steps_total:
          type: integer
          const: 7
          description: Stated so the page's "step 6 of 7" needs no constant of its own.
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: |
            When anything last wrote to this review. See `ReviewTimings.last_activity_at`
            — null means nothing has written since the record began keeping it, which is
            every review from before DEV-890, and the row says so rather than drawing a
            figure.

        # -- off the desk (DEV-957) ---------------------------------------------------
        left_the_desk:
          oneOf:
            - $ref: '#/components/schemas/LeftTheDesk'
            - type: 'null'
          description: |
            How this review left the desk, or null while it is in play. **The two are told
            apart on every row, which is DEV-957's own criterion**, and a row cannot work
            the second one out for itself: a dismissal is a column on the review, but
            whether the pull request is finished is read off whichever round of it a
            harvest last reached — a fact about the pull request that a row holding one
            review has not got.

            **Dismissed outranks finished.** A review the developer dismissed and whose
            pull request later merged says `dismissed`: the dismissal is an act somebody
            took and the merge is something that happened to it, and the issue settles it
            that way. The `show` filter agrees, so such a review is under **Dismissed**
            and not under **Finished**.
        finished_how:
          oneOf:
            - $ref: '#/components/schemas/PrState'
            - type: 'null'
          description: |
            Which way the pull request ended, on a row whose `left_the_desk` is `finished`:
            `merged` or `closed`. Null otherwise, and never `open`.

            **Read off the pull request, not off `review.pr_state`.** That column is this
            one round's last harvest, and three of the four rounds of a merged pull request
            hold nothing in it — so a row wording itself from the review would say "merged"
            about a pull request that closed, or say nothing at all.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the pull request merged or closed, on a row whose `left_the_desk` is
            `finished`. Null otherwise, and null for a finished review GitHub gave no time
            for — a row must then say it merged without naming the day.

    LeftTheDesk:
      type: string
      enum: [dismissed, finished]
      description: |
        How a review left the desk. **Two different facts, deliberately not one.**

        `dismissed` is the developer's act: they will not act on this review again, and
        the reason is in their own words on the review. `finished` is the record saying
        the pull request merged or closed, which nobody decided — it happened, and no
        round of that pull request can be posted afterwards.

        Before DEV-957 only the first existed, and the queue consequently held five drafts
        on pull requests that had already merged. Patrick asked whether they should be
        dismissed or gone; ruled: neither — finished.

    NotForSigning:
      type: object
      additionalProperties: false
      required: [reason]
      description: |
        Why nothing on this review may be signed off. **The page's sentence and the API's
        refusal come off this one value**, which is what stops a screen offering a sign-off
        the API refuses: `POST …/draft/approve`, `POST …/draft/send-back`,
        `POST …/brief/confirm` and `POST …/nit-ticket` all answer `409` for exactly the
        reviews this is non-null for.

        The three reasons carry what the sentence needs and nothing more.
      properties:
        reason:
          type: string
          enum: [dismissed, finished, superseded]
          description: |
            `dismissed` — the developer took it out of play. `finished` — its pull request
            merged or closed. `superseded` — a newer round of the same pull request exists
            and this round was never posted, so it can never be the review that posts.

            **The order they are asked in is the order they are listed in**, and each
            ordering is a decision. Dismissed before finished: a dismissed review that
            then merges stays dismissed. Finished before superseded: once the pull request
            is over, which round is newest no longer matters.
        how:
          $ref: '#/components/schemas/PrState'
          description: |
            Merged or closed, present only when `reason` is `finished`. Never `open`: an
            open pull request is not a reason to refuse a sign-off.
        at:
          type: [string, 'null']
          format: date-time
          description: |
            When it merged or closed, present only when `reason` is `finished`. Null when
            GitHub gave no time, and the sentence then names no day.
        by_round:
          type: integer
          format: int64
          minimum: 2
          description: |
            The newest round of the pull request, present only when `reason` is
            `superseded`. At least 2: round 1 can be superseded and cannot supersede.

    BriefOption:
      type: object
      additionalProperties: false
      required:
        [key, title, argument_for, argument_against, chosen, proposed_by, verdicts]
      description: |
        One alternative, written before the diff was read. The store holds the option map
        as one opaque string today; this is the shape the screen needs instead.
      properties:
        key:
          type: string
          pattern: '^[A-Z]$'
          description: The letter the option is known by.
        title: { type: string, minLength: 1 }
        argument_for: { type: string, minLength: 1 }
        argument_against: { type: string, minLength: 1 }
        chosen:
          type: boolean
          description: Whether this is what the author built.
        proposed_by:
          $ref: '#/components/schemas/OptionProposer'
        verdicts:
          type: array
          items: { $ref: '#/components/schemas/BriefOptionVerdict' }
          description: |
            What this option does about each numbered problem, in problem order. Empty for
            a brief that numbers no problems, or that recorded no verdicts.

            Feeds the Alternatives page's matrix: one row per option, one column per
            numbered problem.

    OptionProposer:
      type: string
      enum: [ticket, blind_pass, both]
      description: |
        Who put an option forward. **`ticket` is what every option already on the record
        carries**, and that is the honest answer rather than a convenience: Review Desk
        runs no blind pass, and nothing had run one when those options were written.

        `both` is the strongest signal the Alternatives page draws — the ticket and an
        independent pass arrived at the same shape.

    BriefOptionVerdict:
      type: object
      additionalProperties: false
      required: [problem, verdict]
      description: What one option does about one numbered problem.
      properties:
        problem:
          type: integer
          format: int64
          minimum: 1
          description: |
            The `Brief.problems[].number` being judged. A verdict against a number the
            brief does not carry is refused on the way in, naming the field and the
            number.
        verdict:
          type: string
          enum: [fixed, partly, stays, not_assessed]
          description: |
            **`not_assessed` is a verdict, not the absence of one.** The board this comes
            from has an option the blind pass never came up with, so nothing scored it
            against the three problems — and "nobody judged this" is a different
            statement from "the brief forgot to judge this".
        why:
          type: [string, 'null']
          description: |
            One line of why. Non-null for every verdict but `not_assessed`, which is the
            one that is the absence of a judgement rather than one.

    BriefFlowBox:
      type: object
      additionalProperties: false
      required: [title]
      description: |
        One box of a flow: a title and a short note. A box with no `problem` is a step
        nothing is wrong with — the plain boxes on the board, neither red nor green.
      properties:
        title: { type: string, minLength: 1 }
        note:
          type: [string, 'null']
          description: The line underneath the title.
        problem:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The `Brief.problems[].number` this box is marked with. On the before flow it
            marks what is wrong; on the after flow, what fixes it.

    BriefFlow:
      type: array
      description: |
        One flow, as rows of one to three boxes. **The nesting carries the layout**: a row
        of two boxes is the split the board draws side by side, and the store assigns the
        row and the slot from the order written so no caller numbers anything.

        Three is the cap because it is a property of the picture: the page draws a row as a
        grid inside one column, and a fourth box is a row that does not fit.
      items:
        type: array
        minItems: 1
        maxItems: 3
        items: { $ref: '#/components/schemas/BriefFlowBox' }

    BriefProblem:
      type: object
      additionalProperties: false
      required: [number, was_wrong, detail_before, detail_after]
      description: |
        One numbered problem. **The number is the brief's one internal identity**: a flow
        box marks it, an option is judged against it and a solution part fixes it.
      properties:
        number: { type: integer, format: int64, minimum: 1 }
        label:
          type: [string, 'null']
          minLength: 1
          description: |
            Two or three words naming this problem, for a heading — "The shared slot".

            **Not a shortening of `was_wrong`, and null on every problem recorded before
            10 October 2026.** The Alternatives page heads one matrix column per numbered
            problem; with no label it heads the column with the number alone and puts the
            sentence one click away. It never draws the sentence as a heading. No length is
            enforced here or in the store — a label that runs long is a writing fault and
            belongs to the linter in Locus.
        was_wrong:
          type: string
          minLength: 1
          description: >-
            One line: what was wrong. The Understand page's "Was wrong" column.
        now_fixed:
          type: [string, 'null']
          description: |
            One line: what it is now. The "Now" column.

            **Null until the change has been described**, which is what lets the problem
            half be written on its own — understand first, then the blind pass, then the
            solution.
        detail_title:
          type: [string, 'null']
          description: What to head the named detail with — "The shared session slot".
        detail_before:
          type: array
          items: { type: string, minLength: 1 }
          description: The named detail behind a click, before the change. One line each.
        detail_after:
          type: array
          items: { type: string, minLength: 1 }
          description: The same, after the change.

    BriefSupportTable:
      type: object
      additionalProperties: false
      required: [columns, rows]
      description: |
        The one small supporting table. On the board it is three questions and who owns
        each, with a before and an after column.

        Every row holds exactly one cell per column, which the store enforces: a ragged
        row would leave the page unable to say which heading a trailing cell sits under.
      properties:
        title:
          type: [string, 'null']
          description: >-
            The heading — "The idea: three questions, each with one owner".
        columns:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        rows:
          type: array
          items:
            type: array
            items: { type: string }

    BriefBlindPass:
      type: object
      additionalProperties: false
      required: [given, looked_up, questions]
      description: |
        The blind pass a session reported running, as it reported it.

        **Review Desk ran nothing and depends on nothing.** `given` is the problem
        statement the session says it handed over and `looked_up` is the session's own
        answer to "what else did you read". Neither can be checked here, and holding them
        is not a claim that they were.
      properties:
        given:
          type: string
          minLength: 1
          description: What the pass was given, verbatim.
        pick_key:
          type: [string, 'null']
          description: |
            The `Brief.options[].key` it would pick. Null when it recommended nothing. The
            key has to be one of the brief's own options.
        pick_why:
          type: [string, 'null']
          description: Why it would pick that one. Non-null exactly when `pick_key` is.
        looked_up:
          type: string
          minLength: 1
          description: What it says it looked up — the word "nothing", or a list.
        questions:
          type: array
          items: { type: string, minLength: 1 }
          description: What it would need to know that the statement did not say.

    BlindPassState:
      type: string
      enum: [not_run, ran_and_found_nothing, ran]
      description: |
        Which of three states the brief's blind pass is in. **Derived from the record,
        never stored**, so it cannot sit above an option list that contradicts it.

        `not_run` — no pass was recorded. `ran_and_found_nothing` — one was, and no option
        carries `proposed_by` of `blind_pass` or `both`. `ran` — one was, and at least one
        option came from it. Three different things for the Alternatives page to draw: no
        blind column, a column saying a fresh pair of eyes proposed nothing, and the
        column itself.

    BriefPart:
      type: object
      additionalProperties: false
      required: [title, summary, fixes, files, lines_added, lines_removed]
      description: |
        One part of the change, as the Solution page draws it: a title, one line, the
        files, and which numbered problems it fixes.

        `coverage.files` is a flat list of every file the change touched and answers "was
        this read". This answers "what was built".
      properties:
        title: { type: string, minLength: 1 }
        summary:
          type: string
          minLength: 1
          description: |
            What this part did, in the session's own words. **Not one line**: on the review
            board A10 was measured against these ran 33 to 52 words each. Shown inside the
            part's opened row, where there is room for it.
        one_line:
          type: [string, 'null']
          minLength: 1
          description: |
            The sentence the part's row carries under its title.

            **Null is the normal state, and the page has a different rendering for it.**
            Nothing writes one yet — that is a Locus change, filed as DEV-920 — and a part
            with none shows its `summary` cut to a single line with an ellipsis. Defaulting
            this from the summary would put a derived value in a field a client could not
            afterwards tell from a written one, which is `Finding.title`'s reasoning for
            the same decision.

            **No maximum length.** A one-line summary that runs to three lines is a writing
            fault and belongs to the review linter, which is this document's rule for every
            other recorded string. The empty string is refused, because a part sent with
            `one_line: ""` would draw a blank row under its title where a part sent with
            none draws its summary.
        fixes:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
          description: |
            The `Brief.problems[].number`s this part fixes, in number order. Empty for a
            part that fixes none — tests and generated types are part of a change and fix
            nothing.
        files:
          type: array
          items: { $ref: '#/components/schemas/BriefPartFile' }
        lines_added:
          type: integer
          format: int64
          minimum: 0
          description: |
            The part's files' `lines_added`, summed. Derived on the way out so the card's
            figure cannot disagree with the list underneath it.
        lines_removed:
          type: integer
          format: int64
          minimum: 0
          description: The same for `lines_removed`.

    BriefPartFile:
      type: object
      additionalProperties: false
      required: [path, lines_added, lines_removed, in_diff]
      description: One file of a part, with what the change did to it.
      properties:
        path: { type: string, minLength: 1 }
        lines_added: { type: integer, format: int64, minimum: 0 }
        lines_removed: { type: integer, format: int64, minimum: 0 }
        in_diff:
          type: boolean
          description: |
            Whether the pull request changed this file.

            **False is how a part claims a file outside the diff.** Two findings on the
            review this came from sat in files the pull request never touched, and a part
            that could not name them would leave those findings belonging to no part. A
            file outside the diff has no lines added or removed, which is what being
            outside it means; the store refuses a row claiming both.

    BriefOpenChoice:
      type: object
      additionalProperties: false
      required: [left_open, chosen, why, departs_from_ticket]
      description: |
        One choice the ticket left open, and what the change chose. A departure from the
        ticket is the same row with `departs_from_ticket` set: the reader wants the same
        two columns either way.
      properties:
        left_open:
          type: string
          minLength: 1
          description: What the ticket left open, or said and the change did otherwise.
        chosen: { type: string, minLength: 1 }
        why: { type: string, minLength: 1 }
        departs_from_ticket:
          type: boolean
          description: Whether this departs from the ticket rather than filling a gap in it.
        finding_seq:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The finding that raises it, if one does. A pointer rather than a requirement:
            an open choice is a choice, not a fault.
        finding_key:
          type: [string, 'null']
          description: '`F` and the sequence number. Derived; the dashboard builds no ids.'

    BriefDisagreement:
      type: object
      additionalProperties: false
      required: [description_says, code_does, finding_seq, finding_key]
      description: |
        One place the description and the code disagree.

        **The finding is required.** DEV-875's rule applies again: a brief that says the
        description claims one thing and the code does another, and raises nothing about
        it, posts a review that never mentions the disagreement — and the author goes on
        reading a description the record knows is wrong.
      properties:
        description_says: { type: string, minLength: 1 }
        code_does: { type: string, minLength: 1 }
        finding_seq: { type: integer, format: int64, minimum: 1 }
        finding_key: { type: string }

    ProblemStatement:
      type: object
      additionalProperties: false
      required: [review_id, problem, flow_before, problems]
      description: |
        The problem half of a brief, and nothing else. What `getProblemStatement` serves,
        and what a session may hand to a blind pass.

        **Built by naming what belongs in it, never by removing what does not.** A read
        that subtracts grows a leak every time the brief grows a field; a read that adds
        cannot. The five fields below are the whole of it.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        problem:
          type: string
          description: |
            What problem the change is solving, as free text. The problem half by name,
            and the only thing a brief written the old way holds.
        how_it_works_today:
          type: [string, 'null']
          description: The context a newcomer needs, in plain words.
        flow_before_caption:
          type: [string, 'null']
          description: The sub-caption above the before flow.
        flow_before: { $ref: '#/components/schemas/BriefFlow' }
        problems:
          type: array
          description: What is wrong, numbered. **`was_wrong` only.**
          items:
            type: object
            additionalProperties: false
            required: [number, was_wrong]
            properties:
              number: { type: integer, format: int64, minimum: 1 }
              was_wrong: { type: string, minLength: 1 }

    Brief:
      type: object
      additionalProperties: false
      required:
        - review_id
        - problem
        - options
        - confirmed
        - confirmation_required
        - flow_before
        - flow_after
        - problems
        - blind_pass_state
        - parts
        - open_choices
        - disagreements
        - updated_at
      description: |
        What the review understood before it read the diff. One per review.

        **The arrays are required and empty for a brief that recorded none**, the way
        `getReview`'s `sources` and `criteria` are: a dashboard that had to check for a
        field's existence as well as its contents would be checking two things to draw
        one. A brief written the old way — `problem`, `diagram`, `provenance` and options
        with a paragraph each way — serves every array empty and every new string null,
        and reads back exactly as it did before.

        Which field feeds which page is in `contract/README.md`, "The brief, by page".
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        problem: { type: string, minLength: 1 }
        diagram:
          type: [string, 'null']
          description: Mermaid source. The dashboard renders it; the server never parses it.
        options:
          type: array
          items: { $ref: '#/components/schemas/BriefOption' }
        approach_verdict:
          type: [string, 'null']
        provenance:
          type: [string, 'null']
          description: |
            Where the problem statement came from and what the developer changed about
            it — "from the ticket and the code · you corrected one sentence".
        confirmed:
          type: boolean
          description: Whether the developer has confirmed it. True exactly when `confirmed_at` is set.
        confirmed_at:
          type: [string, 'null']
          format: date-time
        confirmation_required:
          type: boolean
          description: |
            Whether the developer has to confirm this brief at all. True unless the agent
            that wrote it recorded otherwise, which it may do only on the first write — a
            brief already written as requiring confirmation cannot be rewritten as needing
            none.

            **False is the one place an agent decides a developer step was unnecessary.**
            Whether it is decided at all is the caller's, and **there is no size
            threshold**: Patrick ruled on 9 October 2026 that the setting is
            `brief_gate: never | always` in Locus, and that it is not a function of how
            many lines a pull request changes. An earlier reading of that decision is why
            this field used to say "more than 200 lines"; it never was the rule, and
            Review Desk holds no number either way. A brief needing no confirmation is
            absent from the Inbox's `briefs_to_confirm`, and the One review screen shows
            it with no confirm button. The developer can still read it and can still send
            the draft back.
        confirmation_not_required_because:
          type: [string, 'null']
          description: |
            Why the caller said no confirmation was needed, in its own words. Non-null
            exactly when `confirmation_required` is false, and the only record of why a
            developer step was skipped. It is also layer 2's detail.
        headline:
          type: [string, 'null']
          description: |
            The one headline sentence the Understand page opens with.

            **It states the answer**, which is why `ProblemStatement` does not carry it:
            it is the one sentence that would anchor a fresh pair of eyes hardest.
        how_it_works_today:
          type: [string, 'null']
          description: |
            How the system works today, in plain words — the context a newcomer needs. It
            was mixed into `problem`, which is why the problem half could not be handed to
            anything on its own.
        flow_before_caption:
          type: [string, 'null']
          description: |
            The sub-caption above the before flow — "The staff page handles OAuth
            sign-in".
        flow_after_caption:
          type: [string, 'null']
          description: The sub-caption above the after flow.
        flow_before:
          allOf:
            - $ref: '#/components/schemas/BriefFlow'
          description: How it works today, as rows of one to three boxes.
        flow_after:
          allOf:
            - $ref: '#/components/schemas/BriefFlow'
          description: How it works after the change, in the same shape.
        problems:
          type: array
          items: { $ref: '#/components/schemas/BriefProblem' }
          description: |
            What is wrong, numbered. The numbers `flow_before[][].problem`,
            `flow_after[][].problem`, `options[].verdicts[].problem` and `parts[].fixes`
            refer to; a write naming a number no problem carries is refused, with the
            field and the number.
        support_table:
          oneOf:
            - $ref: '#/components/schemas/BriefSupportTable'
            - type: 'null'
          description: The one small supporting table. Null when the brief holds none.
        blind_pass:
          oneOf:
            - $ref: '#/components/schemas/BriefBlindPass'
            - type: 'null'
          description: |
            The blind pass a session reported running. Null when none ran. Review Desk
            runs none.
        blind_pass_state: { $ref: '#/components/schemas/BlindPassState' }
        parts:
          type: array
          items: { $ref: '#/components/schemas/BriefPart' }
          description: The change in parts, in the order they are to be drawn.
        open_choices:
          type: array
          items: { $ref: '#/components/schemas/BriefOpenChoice' }
          description: The choices the ticket left open, and the departures from it.
        disagreements:
          type: array
          items: { $ref: '#/components/schemas/BriefDisagreement' }
          description: Where the description and the code disagree. Each names a finding.
        updated_at: { type: string, format: date-time }

    FindingHunkLine:
      type: object
      additionalProperties: false
      required: [marker, line, text]
      description: |
        One line of a finding's hunk: what the pull request did to it, the number the
        dashboard draws beside it, and its text.
      properties:
        marker: { $ref: '#/components/schemas/HunkLineMarker' }
        line:
          type: [integer, 'null']
          minimum: 1
          description: |
            The number to draw beside this line, **derived rather than stored**: counting
            from the hunk's `start_line`, an `added` or `unchanged` line takes the next
            number and a `removed` line takes none. A `removed` line is therefore always
            `null` — it is not in the file any more, and the design draws no number for
            it.

            Derived here for the reason `key` and `rule_key` are: the dashboard renders
            what it is given and computes nothing.
        text:
          type: string
          description: |
            The line, verbatim, with no end-of-line character. **It may be empty, and it
            may be nothing but whitespace**, and either is the line as the agent wrote it.
            Review Desk does not fetch code, so this is the only copy of it there is: it
            is never trimmed, re-wrapped or normalised, on the way in or the way out.

    FindingHunk:
      type: object
      additionalProperties: false
      required: [file, start_line, lines]
      description: |
        The lines around a finding, as the pull request changed them.

        **Stored exactly as the agent gave it.** Review Desk does not fetch code and does
        not highlight it; the hunk is evidence the review wrote down, not a view onto the
        repository, and it is served back unaltered.
      properties:
        file:
          type: string
          minLength: 1
          description: |
            The file the hunk is from. Its own field rather than the finding's `file`: a
            finding can point at a call site and show the hunk it calls into.
        start_line:
          type: integer
          format: int64
          minimum: 1
          description: |
            The number the hunk's first **numbered** line carries. A `removed` line carries
            none, so a hunk may open on a removal and still number from here.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FindingHunkLine' }
          description: The lines, in the order they are to be drawn.

    Finding:
      type: object
      additionalProperties: false
      required:
        [review_id, seq, key, lens, severity, claim, disposition, created_at,
         github_comment_id]
      description: |
        One thing the review found. Never deleted, only dispositioned.

        **`seq` is the finding's identity across every round of the pull request.** The
        round fields at the end of this object are what makes a second-round review
        answerable: which earlier finding this one continues, what became of it in this
        round, and what a new one is attributed to. They are nullable and not required,
        like `rule_id` and `rule_key` above — the server serves them on every finding, and
        a client reading a response from before DEV-873 sees them absent rather than wrong.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            **Stable across every round of the pull request, from 1.** A carried finding
            keeps the number it had — F2 in round 1 is F2 in round 3 — and a new finding
            takes the next number unused on the pull request, so no two findings of one
            pull request share a number.

            Findings written before migration 7 were numbered within their review, so two
            rounds of one pull request may hold the same number. Such a round has no links
            and reads as a first round.
        key:
          type: string
          pattern: '^F[0-9]+$'
          description: |
            `seq` as a person quotes it — `F1`. Derived as `F` followed by `seq`, so it
            needs nothing stored; the dashboard displays this and never computes it.
        lens:
          type: string
          minLength: 1
          description: Which review lens found it. Open set; the lenses live in review-craft.
        severity: { $ref: '#/components/schemas/Severity' }
        file: { type: [string, 'null'] }
        line: { type: [integer, 'null'], minimum: 1 }
        claim: { type: string, minLength: 1 }
        title:
          type: [string, 'null']
          minLength: 1
          description: |
            The one line a row of the code review page carries — "A retried delivery
            carries no idempotency key".

            **Null is the normal state, and the page has a different rendering for it.** The
            record held no title until DEV-878 and nothing writes one yet — having the review
            session write them is out of that issue's scope — so a finding with none shows
            its `claim`, clamped to two lines. Defaulting this from the claim would be a
            56-word "title" a client could not tell from a real one.

            Not `DraftSection.title`, which is the heading the body posts and exists only
            once a draft has been written. This is read before that, and a `rewrite` changes
            that one and not this.

            **No maximum length.** A title that runs long is a writing fault and belongs to
            the review linter, which is this document's rule for every other recorded string.
            The empty string is refused, because it would draw a blank row where no title
            draws the claim.
        evidence: { type: [string, 'null'] }
        disposition: { $ref: '#/components/schemas/Disposition' }
        disposition_reason:
          type: [string, 'null']
          description: Why it was held back or suppressed.
        github_comment_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: |
            The GitHub review comment this finding was posted as. **How the finding
            reached the author**, and the only route by which anything can come back on
            it: the harvester reads a reply and a resolution out of that comment's thread
            and reads neither without one.

            Null for a finding the posted review raised only in its body, which is every
            finding until something runs `review-desk finding link` — and that is why
            `InboxPostedItem.findings_linked` exists. A review whose findings carry none
            of these can receive no reply the harvester could see, so "0 replies" there is
            the absence of a measurement rather than one.

            Written by the session that posted the review. Nothing in this document writes
            it, and nothing here posts a comment.

            **Required**, unlike `rule_id` and the round fields beside it, and for the
            reason `Review.pr_state` is: it is the input to a figure three
            implementations derive — the server, the dashboard's sample records, and the
            store's own example test — and optional is how such a field comes to have
            three answers with every check green.
        rule_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The rule this finding was raised under, if any. This is the citation that
            makes a rule's "cited by 6 later findings" count answerable and the one that
            keeps a rule from going stale.
        rule_key:
          type: [string, 'null']
          pattern: '^R-[0-9]{2,}$'
          description: The cited rule's display key, for the link on the screen.
        hunk:
          oneOf:
            - $ref: '#/components/schemas/FindingHunk'
            - type: 'null'
          description: |
            The lines around the finding, as the pull request changed them, or `null` for a
            finding written with only a file and a line — which still displays, with its
            file and line and no code.
        flagged_line:
          type: [integer, 'null']
          minimum: 1
          description: |
            The line the inline comment attaches to. When a `hunk` is present this is one
            of the numbers that hunk draws, so the comment can be rendered in place; the
            server refuses a write that anchors a comment to a line the hunk does not draw.
        inline_comment:
          type: [string, 'null']
          description: |
            The comment as it will be posted on that line, stored verbatim.

            **Not the `claim`.** The claim is what the record says is wrong, in the
            record's voice; this is what the author reads on GitHub, and the design
            captions it "as it will post" to say exactly that. Nothing here posts it.
        why_it_matters:
          type: [string, 'null']
          description: The consequence, in a sentence or two. Stored verbatim.
        proof:
          type: [string, 'null']
          description: |
            How the review knows — test output, two logged keys, a line read. Stored
            verbatim, newlines and all, and the dashboard renders it as written.
        proof_note:
          type: [string, 'null']
          description: |
            The plain caption beneath the proof — "A throwaway test, not committed.",
            "Two attempts logged against a local endpoint."

            Its own field rather than more of `proof`, because the two are drawn
            differently: the proof is a monospace block and this is a sentence about it.
            A caption folded into `proof` would render as though it were test output.
        verification: { $ref: '#/components/schemas/FindingVerification' }
        suggested_fix:
          type: [string, 'null']
          description: What would fix it. Stored verbatim.
        fix_references:
          type: array
          items: { type: string, minLength: 1 }
          description: |
            Sibling code the fix should look like — `SendInvoiceEmail.php:44` — in the
            order the review gave them. Empty, not null, when there are none: a finding
            with no references has none, which is a measurement.
        created_at: { type: string, format: date-time }

        # -- the finding across rounds (DEV-873) -------------------------------------
        round_status:
          oneOf:
            - $ref: '#/components/schemas/RoundStatus'
            - type: 'null'
          description: |
            What became of this finding in this round. Absent only from a response written
            before DEV-873; the server always serves it.
        round_status_by:
          oneOf:
            - $ref: '#/components/schemas/DecidedBy'
            - type: 'null'
          description: Who decided that status. Null while nothing has been decided.
        round_status_checked:
          type: [string, 'null']
          description: |
            How it was checked, in the checker's own words — "their new test fails with the
            fix reverted". The page shows it under "Checked."
        round_status_at:
          type: [string, 'null']
          format: date-time
        round_status_commit:
          type: [string, 'null']
          pattern: '^[0-9a-f]{7,40}$'
          description: |
            The commit the status rests on: for a fixed finding, the commit that fixed it.
            The chip beside a fixed finding on the page.
        continues_review_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The review of the earlier round this finding was carried from. Null for a
            finding raised in this round, and for every finding written before DEV-873.

            The number is not repeated beside it, because it cannot differ: a carried
            finding keeps its number, so this plus `seq` names the finding it continues.

            **A carried finding keeps everything it *is*** — its claim, its evidence, its
            hunk, its inline comment, its consequence, its proof and its fix — so this page
            can be read without reading the earlier round's. A carried hunk is the code as
            it stood at that round's head commit, which is correct by definition for a
            `still_open` finding and is why a `fixed` one draws no hunk.
        continues_round:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            Which round that was, by number — "raised in round 1". Derived from
            `continues_review_id`, so the dashboard does not have to join the timeline to
            answer it. Served by `getReview` only.
        rounds_open:
          type: [integer, 'null']
          minimum: 0
          description: |
            How many consecutive rounds this finding has been open, counting this one —
            "open for 2 rounds". 0 when it is not open now: the sentence is about a finding
            that still is, and a fixed finding counting the rounds it used to be open for
            would read as a complaint.

            Derived by walking `continues_review_id` back, so it cannot drift from the
            chain. Served by `getReview` only.
        introduced_by_commit:
          type: [string, 'null']
          pattern: '^[0-9a-f]{7,40}$'
          description: |
            The commit a new finding is attributed to — "introduced by a41c9e2".
        introduced_by_seq:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The earlier finding whose fix caused this one, by its number — "the commit that
            fixed F1". A number alone is enough, because after DEV-873 a number is an
            identity across the whole pull request.
        introduced_by_key:
          type: [string, 'null']
          pattern: '^F[0-9]+$'
          description: That finding's display key, derived as `F` plus the number.
        late:
          type: [boolean, 'null']
          description: |
            Whether this is a new finding on code that has not changed since the previous
            round — something the earlier round could have caught and did not.

            **Three-valued on purpose.** Null means the question cannot be answered: a
            first round, a finding carried from an earlier round, a finding that names no
            file, or a round where nothing is known about what its commits touched —
            including one whose commits are recorded with no file lists. Reporting `false`
            for any of those would read as "this was not missed", which is a claim nothing
            is in a position to make.

            **It is keyed on `continues_review_id`, not on `round_status`.** A status is a
            separate and mutable axis: accepting the author's reason on a finding raised in
            this round must not change when it was raised. Served by `getReview` only.

    SetFindingDispositionRequest:
      type: object
      additionalProperties: false
      required: [disposition]
      properties:
        disposition: { $ref: '#/components/schemas/Disposition' }
        reason:
          type: [string, 'null']
          description: |
            Required by the server when moving to `held_back` or `suppressed`: a finding
            removed from the draft without a reason teaches the harvester nothing.

    Outcome:
      type: object
      additionalProperties: false
      required: [id, review_id, finding_seq, finding_key, kind, actor, occurred_at]
      description: What became of a finding.
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        review_id: { type: integer, format: int64, minimum: 1 }
        finding_seq: { type: integer, format: int64, minimum: 1 }
        finding_key: { type: string, pattern: '^F[0-9]+$' }
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        actor: { $ref: '#/components/schemas/Actor' }
        occurred_at: { type: string, format: date-time }
        detail:
          type: [string, 'null']
          description: Anything worth saying beyond the kind — "Blocker to Should".

    SeverityCounts:
      type: object
      additionalProperties: false
      required: [blocker, should, nit, question]
      properties:
        blocker: { type: integer, minimum: 0 }
        should: { type: integer, minimum: 0 }
        nit: { type: integer, minimum: 0 }
        question: { type: integer, minimum: 0 }

    DispositionCounts:
      type: object
      additionalProperties: false
      required: [in_draft, held_back, suppressed]
      properties:
        in_draft: { type: integer, minimum: 0 }
        held_back: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }

    NitTicketStatus:
      type: string
      description: |
        `none` until the developer asks for one; `requested` once they have and before an
        agent files it; `filed` once a ticket id is recorded.
      enum: [none, requested, filed]

    NitTicket:
      type: object
      additionalProperties: false
      required: [review_id, status, finding_seqs]
      description: |
        The one ticket covering the nits held back from this review's draft. Review Desk
        records it; it does not file it.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        status: { $ref: '#/components/schemas/NitTicketStatus' }
        ticket_id: { $ref: '#/components/schemas/ForeignId' }
        finding_seqs:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
          description: The held-back findings the ticket covers.
        requested_at: { type: [string, 'null'], format: date-time }
        filed_at: { type: [string, 'null'], format: date-time }

    RequestNitTicketRequest:
      type: object
      additionalProperties: false
      properties:
        ticket_id: { $ref: '#/components/schemas/ForeignId' }

    ReviewDetail:
      type: object
      additionalProperties: false
      required:
        - review
        - layers
        - findings
        - outcomes
        - finding_severities
        - finding_dispositions
        - nit_ticket
        - sources
        - criteria
        - coverage
        - timings
      description: Everything the One review screen shows.
      properties:
        review: { $ref: '#/components/schemas/Review' }
        layers:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/ReviewLayer' }
        brief:
          oneOf:
            - $ref: '#/components/schemas/Brief'
            - type: 'null'
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/Outcome' }
        finding_severities: { $ref: '#/components/schemas/SeverityCounts' }
        finding_dispositions: { $ref: '#/components/schemas/DispositionCounts' }
        not_checked:
          type: [string, 'null']
          description: |
            What the review did not look at, in one sentence, in the reviewer's own words.
            It is the sentence the posted review carries.

            **Non-null only when `coverage.source` is `sentence`, and that is what stops a
            screen showing two coverage answers.** Since DEV-875 a review can also record
            a per-file change map, which is a better record of coverage than one sentence
            and includes a row per area that was not reviewed. When it has one,
            `coverage.source` is `files` and this field is null — not because the sentence
            was deleted, but because it is no longer the coverage record. The store still
            holds it, and the session that writes the draft body reads it back through
            `review-desk review show`.

            So a page cannot render a disagreement: when the table exists this is null, and
            when this is set the table is empty. See `Coverage`.
        nit_ticket: { $ref: '#/components/schemas/NitTicket' }
        draft_status:
          oneOf:
            - $ref: '#/components/schemas/DraftStatus'
            - type: 'null'
          description: Null when no draft has been written yet.
        sources:
          type: array
          items: { $ref: '#/components/schemas/ReviewSource' }
          description: |
            The "Read from" list under the title, in the order the session wrote it. Empty
            for a review that recorded none.
        criteria:
          type: array
          items: { $ref: '#/components/schemas/AcceptanceCriterion' }
          description: |
            "What the ticket asks for", in the order the session wrote it. Empty for a
            review that recorded none.
        description_lint:
          oneOf:
            - $ref: '#/components/schemas/ReviewDescriptionLint'
            - type: 'null'
          description: |
            Layer 1's result, on the **pull request's description** — a different thing
            from `DraftLint`, which is the lint over the review body this session will
            post. Null when it has not run, for the reason `DraftDetail.lint` is nullable:
            a failing lint and an absent one are not the same thing.
        coverage: { $ref: '#/components/schemas/Coverage' }
        timings:
          allOf:
            - $ref: '#/components/schemas/ReviewTimings'
          description: |
            How long the review has taken: the totals. **Each step's own figures are on
            `layers[]`** rather than repeated here — see `ReviewTimings`.

        # -- the review's place in the pull request (DEV-873) ------------------------
        rounds:
          type: array
          items: { $ref: '#/components/schemas/RoundSummary' }
          description: |
            **Every round of this pull request, oldest first, including this one.** The
            timeline across the top of the round-two page: what each round posted, as which
            event, how many findings it held, and what came back.

            Always served and never empty — a review is itself a round. It is not required
            here, for the reason the `Finding` round fields are not: a response written
            before DEV-873 is missing it rather than wrong.
          minItems: 1
        commits_since_previous_round:
          type: array
          items: { $ref: '#/components/schemas/RoundCommit' }
          description: |
            **The commits between the previous round's head commit and this one's**, oldest
            first — "what changed since round 1".

            Empty for a first round, and empty for a round whose commits have not been
            recorded yet; the two are not distinguishable here, which is why `Finding.late`
            is null rather than false in the second case. Recorded by
            `review-desk round commits`, which reads GitHub and writes nothing to it.

    DraftLint:
      type: object
      additionalProperties: false
      required: [passes, checked_at]
      description: |
        The result of running the review-craft lint over the draft body. Every count is
        of the body as it stands, re-run on every save.
      properties:
        passes:
          type: boolean
          description: Whether the lint reported no errors. Warnings do not fail it.
        visible_words:
          type: [integer, 'null']
          minimum: 0
        word_budget:
          type: [integer, 'null']
          minimum: 0
          description: The budget for this change's size, so the screen can show "118 of 150".
        findings_in_body:
          type: [integer, 'null']
          minimum: 0
          description: Findings the body actually raises.
        findings_expected:
          type: [integer, 'null']
          minimum: 0
          description: Findings at disposition `in_draft`. A mismatch means one was dropped silently.
        raised_before_on_pr:
          type: [integer, 'null']
          minimum: 0
          description: |
            Findings in this body already raised in an earlier round on the same pull
            request. Non-zero is a review going in a circle.
        errors:
          type: array
          items: { type: string }
          description: The lint's error lines, verbatim. Empty when it passes.
        checked_at: { type: string, format: date-time }

    DraftSection:
      type: object
      additionalProperties: false
      required: [position, kind, text, agent_text, rewritten, posted]
      description: |
        One block of the draft body. **The body is composed of these**, joined by a blank
        line and ending in one newline, and a `finding` block composes only while its
        finding is posted — which is what cutting a finding does to the review.

        A block that does not post is still served: a cut finding's block stays on the
        record, which is the difference between a decision and a deletion.
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
          description: Where it sits in the body, from 1. Assigned by the server.
        kind: { $ref: '#/components/schemas/DraftSectionKind' }
        finding_seq:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: The finding this block is about. Null on a block of prose.
        finding_key: { type: [string, 'null'], pattern: '^F[0-9]+$' }
        severity:
          oneOf:
            - $ref: '#/components/schemas/Severity'
            - type: 'null'
          description: |
            The finding's severity, which the heading is composed with. Derived from the
            finding and never stored against the block, so regrading changes it.
        heading:
          type: [string, 'null']
          description: |
            The heading line this block composes, as the posted body carries it:
            `### Blocker · F1 · A retried delivery is sent without an idempotency key`.
            Null on a block of prose. Served rather than left to the dashboard so the
            format lives in one place.
        title:
          type: [string, 'null']
          description: The heading's title — the part after the severity and the number.
        text:
          type: string
          description: |
            The paragraph, as it will post. The developer's words once they have rewritten
            it. May be empty on a finding block: a heading on its own is a finding the
            draft raises without elaborating.
        agent_title:
          type: [string, 'null']
          description: The title as the agent wrote it.
        agent_text:
          type: string
          description: |
            The paragraph as the agent wrote it — **what a rewrite replaced**. Equal to
            `text` until the developer's words replace it, by a `rewrite` or by a `keep`
            that carried its own paragraph.
        rewritten:
          type: boolean
          description: |
            Whether the developer has rewritten this block. Derived from `text` and
            `agent_text` rather than stored, so it cannot disagree with them.
        posted:
          type: boolean
          description: |
            Whether this block is in `draft.body`. Always true for prose; for a finding
            block, true while the finding is at disposition `in_draft` with round status
            `new` or `still_open`. **A carried finding whose round status is `fixed`,
            `accepted`, `withdrawn` or `ticketed` is not posted as an open finding**, and
            what the round found about it belongs in a block of prose.

    DraftThread:
      type: object
      additionalProperties: false
      required: [finding_seq, finding_key, severity, title, path, line, side, body]
      description: |
        One inline thread the draft hands over: a finding with a line inside the diff,
        composed from its block and ready to post on that line.

        **A finding is either a thread or a section of the body, never both.** It is a
        thread when the record can anchor it — the finding names a file, it names the line
        its comment attaches to, it carries a hunk, and that hunk is one `git diff -U3`
        drew and draws that line. A hunk whose every entry is `unchanged` came from
        `git show` and is a line the change does not touch, so such a finding keeps its
        section in the body. Either way it has one row in the body's index, and **that row
        links to the line, which is the line the thread sits on**.

        **Review Desk posts nothing.** The session puts these in the `comments` array of
        its one `POST /repos/{owner}/{repo}/pulls/{number}/reviews` call, with the body
        beside them, which is what keeps the review count at one. They are handed over only
        on a draft this API reports `approved`.
      properties:
        finding_seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            The finding, by the number that is its identity across rounds. What
            `review-desk finding link` needs once GitHub has answered with a comment id.
        finding_key: { type: string, pattern: '^F[0-9]+$' }
        severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          description: |
            The finding's live severity, which picked the alert the comment sits in:
            `blocker` takes `[!CAUTION]`, `should` takes `[!WARNING]`, `question` takes
            `[!NOTE]`, and `nit` takes no alert at all — the lighter shape, because four
            labels on a one-line nit is why nits read as heavy as blockers.
        title:
          type: string
          minLength: 1
          description: The heading's title, as the index row carries it too.
        path:
          type: string
          minLength: 1
          description: |
            The file the comment is anchored on. **The hunk's file, not the finding's**: the
            line is numbered from the hunk's own `start_line`, and a finding may point at
            one file and show the code of another.
        line:
          type: integer
          format: int64
          minimum: 1
          description: |
            The line the comment sits on, **in the new file's numbering** — the right-hand
            side of the diff.
        side:
          type: string
          const: RIGHT
          description: |
            Which side of the diff, and it is always `RIGHT`. A removed line carries no
            number in this record, so a flagged line is always a line still in the file;
            where a finding is about a line the change deleted, the line to flag is the one
            that replaced it, and the comment says the code at fault is gone. Nothing here
            can ask GitHub for `LEFT` or for the old file's numbering.
        body:
          type: string
          minLength: 1
          description: |
            The comment as it will post: the block's text, carried through unaltered inside
            the alert, under a title line composed from the record. The title line is the
            severity and the finding's number in bold, an em dash, the title, and where the
            finding stands as a code span — `Open` or `Still open`.

            **It ends with an HTML comment naming the finding** — `<!-- review-desk:F3 -->`
            — and that line is load-bearing. GitHub's review call answers with the review
            and not with the comments it made, so a session has to read them back and match
            each one to its finding before it can record which comment a finding was posted
            as; and the obvious key, the path and the line, is not unique, because a Should
            and a Nit on the same line is ordinary. An HTML comment is invisible on GitHub
            and comes back verbatim in the comment's `body`.

            The `in diff` / `pre-existing` tag stays where the session wrote it, on the
            block's first line, because it is prose no part of this record carries. A session
            that signs its comments appends its own `agent:` marker after the line above;
            Review Desk composes none.

    DraftEdit:
      type: object
      additionalProperties: false
      required: [finding_seq, finding_key, kind, summary]
      description: |
        One edit the developer made between draft and post. Stored as an `Outcome` with
        actor `developer`; this is that outcome as the screen lists it.
      properties:
        finding_seq: { type: integer, format: int64, minimum: 1 }
        finding_key: { type: string, pattern: '^F[0-9]+$' }
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        summary:
          type: string
          minLength: 1
          description: What changed — "rename suggestion", "Blocker to Should", "first sentence".
        occurred_at: { type: [string, 'null'], format: date-time }

    HeldBackFinding:
      type: object
      additionalProperties: false
      required: [finding_seq, finding_key, claim]
      properties:
        finding_seq: { type: integer, format: int64, minimum: 1 }
        finding_key: { type: string, pattern: '^F[0-9]+$' }
        claim: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/Severity' }

    Draft:
      type: object
      additionalProperties: false
      required: [review_id, body, status, updated_at]
      description: |
        The draft review. **The merged store has no table for this**; the record is
        specified in contract/README.md and migrated by a later issue. An approved draft
        is what the review session reads and posts.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        body:
          type: string
          description: |
            The review body as GitHub-flavoured markdown, posted verbatim. May be empty
            while the status is `drafting`.

            **Composed from the blocks, in the house style's shape.** The session's prose
            blocks are carried through character for character — the verdict line, the
            `**Method**` line, `### Problem fit` with its diagram, the folded provenance —
            and between them sits an index of every posted finding: the glyph and the
            severity, the place in the code, the title, and where it stands. A finding with
            a line inside the diff is a row and a `DraftThread`, not a section; a finding
            with nowhere to anchor is a row and a section. Each row links to the line the
            finding is about at the head commit reviewed, because a review body resolves no
            anchor of its own and the thread it would otherwise link to does not exist until
            the moment of posting.
        status: { $ref: '#/components/schemas/DraftStatus' }
        event:
          oneOf:
            - $ref: '#/components/schemas/ReviewEvent'
            - type: 'null'
          description: Chosen at approval. Null until then.
        approved_at: { type: [string, 'null'], format: date-time }
        sent_back_note:
          type: [string, 'null']
          description: The developer's instruction when the draft was sent back.
        sent_back_at: { type: [string, 'null'], format: date-time }
        posted_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the session reported the posted review. Set together with the review's
            `github_review_id`, never by this API acting on GitHub.
        updated_at: { type: string, format: date-time }

    DraftDetail:
      type: object
      additionalProperties: false
      required:
        [draft, review, lint, sections, threads, body_is_stale, edits, held_back, nit_ticket,
         not_for_signing]
      description: Everything the Draft preview screen shows.
      properties:
        draft: { $ref: '#/components/schemas/Draft' }
        review: { $ref: '#/components/schemas/Review' }
        not_for_signing:
          oneOf:
            - $ref: '#/components/schemas/NotForSigning'
            - type: 'null'
          description: |
            Why this draft may not be signed off, or null when it may. **A screen with a
            non-null value here draws the reason and offers no sign-off**, which is
            DEV-957's "an unposted draft on a finished review says so and cannot be signed
            off" — the saying-so and the cannot are one field, so a page cannot offer a
            button the API refuses.

            It is not about the draft's status. A `ready` draft on a merged pull request is
            ready and unsignable, and the two facts are served separately so the screen can
            say which it is up against.
        lint:
          oneOf:
            - $ref: '#/components/schemas/DraftLint'
            - type: 'null'
          description: |
            Null when the lint has not run over this body yet — a draft still at
            `drafting`, or one whose body was just replaced.

            `DraftLint` requires `passes` and `checked_at`, so there is no shape of it
            that means "not measured": serialising a draft with no lint would mean
            inventing `passes: false` and a time, and a failing lint and an absent one are
            not the same thing. This contract's own rule is that a count the store cannot
            answer is null and never zero; the same reasoning applies to the whole object.
            Made nullable in DEV-861, found by the DEV-860 session.
        sections:
          type: array
          items: { $ref: '#/components/schemas/DraftSection' }
          description: |
            The blocks the body is composed of, in order — including the ones that do not
            post. Empty on a draft with no body at all.
        threads:
          type: array
          items: { $ref: '#/components/schemas/DraftThread' }
          description: |
            The inline threads this draft hands over, most serious first then by number —
            one per finding with a line inside the diff. Empty when no finding can be
            anchored, which is a review whose findings are all corrections, all outside the
            change, or all without a hunk.

            **The body does not carry these.** An anchored finding is a row in the body's
            index and a comment on the code, so the screen that exists so nothing is posted
            unread has to draw both. They change together: cutting a finding takes its row
            and its thread.
        body_is_stale:
          type: boolean
          description: |
            Whether the stored body is no longer what the draft's blocks compose to — the
            one state the hand-over cannot serve.

            **False on every draft this API wrote**: each write composes the body from the
            blocks in the same transaction. What it catches is a draft approved before the
            composition changed shape, which an upgrade leaves behind and which would post
            each anchored finding twice, once as a section and once as a comment. The way
            out is the developer's: take the sign-off back by sending the draft back with a
            note, and the session writes it again.

            **On a `posted` draft it can read true without anything being wrong.** The body
            that was posted is the stored one, and the record is allowed to move on after
            the post — the harvest reads outcomes back and a finding's round status changes
            with them. What the flag answers is "could this be handed over as it stands",
            and after the post there is nothing left to hand over.
        edits:
          type: array
          items: { $ref: '#/components/schemas/DraftEdit' }
        held_back:
          type: array
          items: { $ref: '#/components/schemas/HeldBackFinding' }
        nit_ticket: { $ref: '#/components/schemas/NitTicket' }

    SaveDraftRequest:
      type: object
      additionalProperties: false
      description: |
        **Either the blocks the body is composed of, or a body to store as one block of
        prose.** The server refuses a save with neither, naming both; `decisions.rs`'s
        `a_draft_saved_with_neither_a_body_nor_blocks_is_refused` holds that.

        **That rule is not written as an `anyOf` of two `required` lists**, which is how it
        reads most naturally and which cannot be used here: `openapi-typescript` generates
        `unknown` for a schema whose root carries both `anyOf` and `properties`, so the
        dashboard's `SaveDraftRequest['edits']` stops type-checking and the generated types
        are worse than the guarantee is worth. Recorded so it is not re-added by someone
        reading the prose above as an oversight.

        Sent with `sections`, the body is composed from them; a `body` sent as well is
        *checked* against the composition and the save is refused when the two disagree by
        anything but trailing newlines. That check is what makes "the assembled draft of a
        review with no decisions is what the agent wrote" true of every write rather than
        of the happy path.

        Sent with a `body` alone it is stored as one block, which is the honest reading of
        a draft nobody wrote in parts — and it has one visible consequence: the
        per-finding decisions refuse on such a draft, because nothing can say which
        characters are F1's without inferring it from the text. Every draft written before
        this operation took blocks is in that state.
      properties:
        body: { type: string }
        sections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, text]
            properties:
              kind: { $ref: '#/components/schemas/DraftSectionKind' }
              finding_seq:
                type: [integer, 'null']
                format: int64
                minimum: 1
                description: Required on a `finding` block and refused on prose.
              title:
                type: [string, 'null']
                description: |
                  The heading's title. Refused on prose; the severity and the number are
                  composed from the finding.

                  **Optional on a `finding` block, because the finding owns its title.** Left
                  out, the server composes the heading from `Finding.title`, falling back to
                  the finding's `claim` for a finding nobody has titled — which is every
                  finding written before the title existed. Two copies of a title are two
                  titles that can disagree, and the finding's is the one a reader sees first.

                  Given, it is used exactly as given. That is what lets a posted heading
                  differ from the one line a row of the code review page carries, and it is
                  what `decideFinding`'s `rewrite` relies on: a rewrite exists to make the
                  two differ, so they are not made unable to.
              text:
                type: string
                description: |
                  The block's markdown, stored verbatim. Refused when it begins or ends
                  with a newline: blocks are joined by exactly one blank line, and a block
                  that brought its own would compose a body nobody wrote. Refused when
                  blank on a prose block.
          description: |
            The blocks, in order. The server numbers them. A `finding` block naming a
            finding that is not posted is refused, as is a second block about a finding
            another block already names.
        edits:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [finding_seq, kind, summary]
            properties:
              finding_seq: { type: integer, format: int64, minimum: 1 }
              kind: { $ref: '#/components/schemas/OutcomeKind' }
              summary: { type: string, minLength: 1 }
          description: |
            The edits this save represents, recorded as outcomes with actor `developer`.
            Empty when the developer only reformatted.

    DecideFindingRequest:
      type: object
      additionalProperties: false
      required: [decision]
      description: |
        What the developer decided, and the words that go with it. See `FindingDecision`
        for the table of what each decision changes.
      properties:
        decision: { $ref: '#/components/schemas/FindingDecision' }
        severity:
          oneOf:
            - $ref: '#/components/schemas/Severity'
            - type: 'null'
          description: |
            The severity to post the finding at. **Required by `regrade` and refused by
            every other decision**, so that a severity cannot change without the record
            saying it was regraded.
        title:
          type: [string, 'null']
          description: |
            The heading's new title, for a `rewrite`. Refused when the draft already holds
            a block for this finding and the decision is not a rewrite: changing what gets
            posted while the record said only "kept" is the thing this operation exists to
            stop.
        text:
          type: [string, 'null']
          description: |
            The paragraph's new text, for a `rewrite`. A `rewrite` needs a title, a text,
            or both. Either is refused when it would compose a body nobody wrote: a blank
            title, or a paragraph beginning or ending with a newline.

            On a `keep` for a finding the draft holds no block for — the designs' "Post
            it" on a held-back nit — this is the paragraph the new block is written with.
            Left out, the server uses the finding's own `why_it_matters`, or failing that
            its `inline_comment`, and refuses when it has neither rather than inventing a
            paragraph.

            **Given here, these words are the developer's and the record says so**: the
            block's `agent_title` and `agent_text` keep the finding's own claim and
            consequence, `rewritten` reads true, and the outcome's detail says the words
            posted were theirs.
        note:
          type: [string, 'null']
          description: |
            Why, in the developer's words. Stored as the outcome's detail, and as
            `round_status_checked` on a decision that changes the round status.

            **Required by `accept_reason`**: it is the author's reason, and a rejection
            with no reason is the one outcome the feedback loop cannot learn from.
            Optional everywhere else — the designs are one click, and the outcome's kind
            and actor are themselves the signal.

    FindingDecisionMade:
      type: object
      additionalProperties: false
      required: [finding, outcome, draft]
      description: |
        The decision, and everything it changed. All three are read inside the decision's
        own transaction, so they are one instant of the record — and the review page draws
        all three, so one call is one re-render.
      properties:
        finding: { $ref: '#/components/schemas/Finding' }
        outcome: { $ref: '#/components/schemas/Outcome' }
        draft: { $ref: '#/components/schemas/DraftDetail' }

    TicketRestAndApproveRequest:
      type: object
      additionalProperties: false
      description: |
        Nothing is required, and the body may be omitted altogether.
      properties:
        note:
          type: [string, 'null']
          description: |
            Why the rest is going to a ticket, in the developer's words. Stored against
            every finding it moves, as the disposition's reason, the round status's check
            and each outcome's detail.

    TicketedAndApproved:
      type: object
      additionalProperties: false
      required: [draft, nit_ticket, ticketed, ticketed_keys]
      description: What "Ticket what is left, and approve" came to.
      properties:
        draft: { $ref: '#/components/schemas/DraftDetail' }
        nit_ticket: { $ref: '#/components/schemas/NitTicket' }
        ticketed:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
          description: |
            The findings this act moved into the ticket, in number order. The nits that
            were already held back are in `nit_ticket.finding_seqs` and not here: this is
            what changed.
        ticketed_keys:
          type: array
          items: { type: string, pattern: '^F[0-9]+$' }

    ApproveDraftRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/ReviewEvent' }

    SendBackDraftRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          description: |
            What the session is to change. Refused when empty: a bare rejection teaches
            nothing.

    RuleScope:
      type: object
      additionalProperties: false
      required: [kind]
      description: How widely a rule applies.
      properties:
        kind:
          type: string
          enum: [global, repo]
        repo:
          oneOf:
            - $ref: '#/components/schemas/RepoName'
            - type: 'null'
          description: Set when `kind` is `repo`, null when `global`.

    RuleCounts:
      type: object
      additionalProperties: false
      description: |
        A rule's counts. Every field is optional because the screen shows a different set
        per stage: a repository rule shows raised, kept and rejected, a CI check shows
        what the check caught instead. A field the store cannot yet answer is null, never
        zero — zero is a measurement and null is the absence of one.
      properties:
        raised:
          type: [integer, 'null']
          minimum: 0
          description: Findings raised citing this rule.
        kept:
          type: [integer, 'null']
          minimum: 0
          description: Of those, the ones the developer kept in the posted draft.
        rejected_with_reason:
          type: [integer, 'null']
          minimum: 0
          description: Of those, the ones an author rejected and gave a reason for.
        cited_by_findings:
          type: [integer, 'null']
          minimum: 0
          description: |
            Of those, the ones on a review **other than** the rule's `origin_review_id` —
            the Rules screen's "cited by 6 later findings".

            **Deliberately a different number from `raised`.** `raised` is every finding
            citing the rule, the ones it was derived from included, so a rule nothing has
            applied since still has a non-zero `raised`. This counts the times it earned
            its place on a review it did not come out of, which is the one of the two that
            answers whether it is worth keeping — and it is what reconciles the example
            below, where R-09 is raised 7 times and cited by 6.

            *Other* is read by review, not by finding. A rule is created *from* findings
            that already exist, so none of them could have cited a rule that did not exist
            when they were written; read by finding the two numbers could never differ.
        caught_by_check:
          type: [integer, 'null']
          minimum: 0
          description: |
            Catches by the lint or CI check this rule graduated into. Review Desk holds
            no CI data, so this is null until something reports it.
        raised_in_a_review_since:
          type: [integer, 'null']
          minimum: 0
          description: |
            Findings raised by a review since the rule became a check. Non-zero means the
            check is not doing the job and a model is still spending tokens on it.
        exceptions:
          type: [integer, 'null']
          minimum: 0
          description: Accepted exceptions to the rule.
        last_human_mention_at:
          type: [string, 'null']
          format: date-time
          description: |
            When a human reviewer last said this out loud. Review Desk has no source for
            it, so it is null until a harvester supplies one.

    Rule:
      type: object
      additionalProperties: false
      required: [id, key, statement, prevents, scope, stage, stale, counts, created_at]
      description: |
        Something learned, that should stop a finding recurring. Every rule names the
        failure it prevents; a preference with no consequence does not qualify.
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        key:
          type: string
          pattern: '^R-[0-9]{2,}$'
          description: |
            `id` as a person quotes it — `R-09`. Derived by zero-padding `id` to two
            digits, so it needs nothing stored and never changes for a given rule.
        statement: { type: string, minLength: 1 }
        prevents:
          type: string
          minLength: 1
          description: The failure it prevents. Never empty; that is what makes it a rule.
        scope: { $ref: '#/components/schemas/RuleScope' }
        stage: { $ref: '#/components/schemas/RuleStage' }
        stage_label:
          type: [string, 'null']
          description: |
            The stage as the screen words it — "Repository rule", "CI check",
            "Repository rule · 1 exception". Derived from `stage` and `counts.exceptions`.
        why_proposed:
          type: [string, 'null']
          description: |
            Why the app proposed it, with the count behind it — "you cut this kind of
            finding from 5 of the last 5 drafts that raised it". Set on proposals.
        note:
          type: [string, 'null']
          description: |
            A free line the screen shows under the statement: a staleness note, or the
            accepted exception and its reason.
        origin_review_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        origin_pr:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: The pull request it was decided on, for the "Decided on #377" link.
        origin_findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [review_id, seq]
            properties:
              review_id: { type: integer, format: int64, minimum: 1 }
              seq: { type: integer, format: int64, minimum: 1 }
        stale:
          type: boolean
          description: |
            Whether nothing has cited it for long enough to question it.

            **A rule is stale when no finding has cited it for 60 days and it has not been
            deferred past today.** Spelled out, in the order the server evaluates it:

            1. A rule whose `review_again_at` is in the future is **not** stale, whatever
               the citations say. That is the whole point of "Keep 60 more days": it
               answers the question for a while without pretending a finding cited the
               rule.
            2. A rule at stage `proposed` or `retired` is **not** stale. Staleness is a
               question about rules in force; a proposal is not in force yet and a retired
               one no longer is.
            3. Otherwise the rule is stale when more than 60 days have passed since
               `last_cited_at` — or, when nothing has ever cited it, since `created_at`,
               so that a rule made yesterday is not stale on its first day merely for
               having no citations yet.

            **60 days is part of this contract, not an implementation detail.** The Rules
            screen says "No finding has cited it in 60 days" and offers "Keep 60 more
            days", so the threshold and the deferral are the same number and it is written
            once, here. The server's constant and this sentence are tied by a test —
            `crates/server/tests/staleness.rs`.

            Derived rather than stored, and not a stage: a stale rule is still in force
            until the developer retires it, which is why `RulesPage` gives it a group of
            its own.
        last_cited_at:
          type: [string, 'null']
          format: date-time
          description: When a finding last cited it. Null means never.
        review_again_at:
          type: [string, 'null']
          format: date-time
          description: |
            Set by "Keep 60 more days". While it is in the future the rule is not stale,
            whatever `last_cited_at` says — see `stale`.
        counts: { $ref: '#/components/schemas/RuleCounts' }
        created_at: { type: string, format: date-time }

    RulesSummary:
      type: object
      additionalProperties: false
      required: [active_rules, active_rules_cap]
      description: The four figures across the top of the Rules screen.
      properties:
        active_rules: { type: integer, minimum: 0 }
        active_rules_cap:
          type: integer
          minimum: 1
          description: The per-repository cap. A rule set nobody can hold in their head is not a rule set.
        replay_matched:
          type: [integer, 'null']
          minimum: 0
          description: |
            Findings that came back the same on the last replay. Review Desk has no
            replay yet, so this is null until the consistency check exists.
        replay_total: { type: [integer, 'null'], minimum: 0 }
        findings_kept: { type: [integer, 'null'], minimum: 0 }
        findings_total: { type: [integer, 'null'], minimum: 0 }
        findings_window_days:
          type: [integer, 'null']
          minimum: 1
          description: The window the kept-findings figures cover.
        raised_twice_on_one_pr:
          type: [integer, 'null']
          minimum: 0
          description: Reviews that raised the same finding twice — a review that went in a circle.

    RulesPage:
      type: object
      additionalProperties: false
      required: [summary, proposed, active, stale]
      description: Everything the Rules screen shows, for one repository or all of them.
      properties:
        repo:
          oneOf:
            - $ref: '#/components/schemas/RepoName'
            - type: 'null'
          description: Null for every repository.
        summary: { $ref: '#/components/schemas/RulesSummary' }
        proposed:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
        active:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
          description: Rules at stage `active`, `lint` or `ci` that are not stale.
        stale:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
          description: In force, but nothing has cited them lately.

    PromoteRuleRequest:
      type: object
      additionalProperties: false
      required: [to_stage]
      properties:
        to_stage: { $ref: '#/components/schemas/RuleStage' }

    ReviewsShown:
      type: string
      enum: [in_play, dismissed, finished, everything]
      default: in_play
      description: |
        Which reviews a list of reviews is being asked for: the ones in play, the ones the
        developer dismissed, the ones whose pull request merged or closed, or all of them.

        **Four positions because there are two ways off the desk**, and they are told
        apart everywhere a review is listed. A review that is both — dismissed, and its
        pull request later merged — is under `dismissed`: it stays dismissed, which is
        what `LeftTheDesk` says too.

    DismissReviewRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: |
            Why this review is being taken out of play — a pull request closed unmerged, a
            duplicate, a request declined. Shown beside the review in the Reviews list's
            dismissed view, so it is written for a reader who has forgotten the review.

    RuleReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: |
            Why. Recorded on the rule so the harvester does not propose the same thing
            again next week with no memory of having been told no.

    DeferRuleRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
          description: How long to keep the rule before asking again.

    InboxTotals:
      type: object
      additionalProperties: false
      required: [items, repos]
      properties:
        items:
          type: integer
          minimum: 0
          description: |
            Every item across the five waiting groups: briefs to confirm, drafts to
            approve, author replies, the developer's own pull requests, and proposed
            rules.

            **`in_progress` and `posted_awaiting_author` are not in it**, and the
            distinction is the screen's headline. Both are the record saying where a
            review is, not a thing asking for an act — so a desk whose only review is
            posted reads "nothing is waiting on you", which is true, rather than
            reporting an item the developer cannot do anything about.
        repos:
          type: integer
          minimum: 0
          description: Distinct repositories those items span.

    InboxPr:
      type: object
      additionalProperties: false
      required: [repo, pr]
      description: The pull request an inbox item is about.
      properties:
        repo: { $ref: '#/components/schemas/RepoName' }
        pr: { type: integer, format: int64, minimum: 1 }
        title: { type: [string, 'null'] }

    InboxBriefItem:
      type: object
      additionalProperties: false
      required:
        [review_id, pull_request, blocks_later_layers, ticket_id, ticket_url]
      description: A brief waiting to be confirmed. Layer 2.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: |
            The ticket the change is for, opaque.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is, so the queue's row can link it without the review being
            opened first. Null for a review with an id and no address, which the row then
            names on its own line and does not link.
        brief_ready_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the brief became ready for the developer: step 2's own time, or — for a
            session that wrote a brief and never reported the step — the brief's
            `updated_at`. Null only when neither exists.
        blocks_later_layers:
          type: boolean
          description: |
            Whether the session is holding at layer 2 for this confirmation. True is
            what justifies "nothing else runs until you confirm" on the screen.

    InboxDraftItem:
      type: object
      additionalProperties: false
      required:
        [review_id, pull_request, round, severities, held_back, is_delta, ticket_id,
         ticket_url]
      description: A draft waiting to be approved. Layer 6.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        round: { type: integer, format: int64, minimum: 1 }
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: |
            The ticket the change is for, opaque.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is, so the queue's row can link it without the review being
            opened first. Null for a review with an id and no address, which the row then
            names on its own line and does not link.
        severities:
          allOf:
            - $ref: '#/components/schemas/SeverityCounts'
          description: |
            **The findings at disposition `in_draft`, and only those** — what this draft
            is about to post, which is what the screen captions it as.

            Said here because it was not, and three copies of the figure came to mean
            three things: the server counted the findings in the draft, the dashboard's
            sample records counted the whole review, and the store's own example test
            counted the whole review too. A held-back nit is not in the draft, and the
            example beside this field carried four nits in `severities` and
            `held_back: 4` at once — asserting both. A figure a schema does not define
            is one every implementation defines for itself.
        held_back:
          type: integer
          minimum: 0
          description: Nits held back for a ticket.
        is_delta:
          type: boolean
          description: |
            Whether this round reviews only what changed since the last one. True when
            `round` is above 1, which the screen words as "delta since your last review".
        draft_ready_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the draft became ready for the developer — step 6 entering
            `waiting_on_you`, the last time it did. **The queue's age cell read "no time
            recorded" here until DEV-890**: the draft holds `approved_at`, `sent_back_at`
            and `posted_at`, and had no time for the one state the developer is waiting in.
            Null for a review from before DEV-890.

    InboxReplyEvent:
      type: object
      additionalProperties: false
      required: [finding_seq, finding_key, kind]
      properties:
        finding_seq: { type: integer, format: int64, minimum: 1 }
        finding_key: { type: string, pattern: '^F[0-9]+$' }
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        detail: { type: [string, 'null'] }

    InboxReplyItem:
      type: object
      additionalProperties: false
      required: [review_id, pull_request, round, events, ticket_id, ticket_url]
      description: |
        An author has acted on a posted review. Built from outcomes with actor `author`
        or `harvester`.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        round:
          type: integer
          format: int64
          minimum: 1
          description: |
            Which round of the pull request the author replied to.

            **Here because the queue draws one row per pull request.** A reply is always on
            the round that was *posted*, which can be an earlier round than the one the row
            is numbered for — `tc/portal#9585` had its round 1 posted and replied to while
            round 2 was still a draft, which is DEV-957's own record. A row saying "the
            author has replied too" under the number of a different round leaves a reader
            to work out which review the reply was on; with this it says "replied to
            round 1".

            `drafts_to_approve` has carried a round since DEV-876 for the same kind of
            reason. `briefs_to_confirm` has none and needs none: a brief is only ever
            confirmed on the round the row is about, because an unposted superseded round
            is in no group at all.
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: |
            The ticket the change is for, opaque.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is, so the queue's row can link it without the review being
            opened first. Null for a review with an id and no address, which the row then
            names on its own line and does not link.
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InboxReplyEvent' }
        replied_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the author last acted — the newest of these events' own times. The queue's
            age cell, which read "no time recorded" before DEV-890 although the outcomes
            had carried a time all along. Null for an item built from no timed outcome.

    InboxPostedItem:
      type: object
      additionalProperties: false
      required:
        [review_id, pull_request, round, rounds_on_pr, posted_at, posted_as, pr_state,
         harvested_at, findings, findings_linked, replies, threads_resolved,
         code_changed_after, ticket_id, ticket_url]
      description: |
        **A review that was posted, whose pull request has not been merged or closed.**
        The queue's "Waiting on the author", and the group that did not exist until
        DEV-930: a review the developer signed off and the session posted left every
        other group here, so the screen could only say the whole thing was not measured
        and the review was reachable by typing its id.

        **Posted** is the draft reported posted, or the review carrying a GitHub review
        id. Two columns in the store answer that question and different commands write
        them: `draft posted` writes both in one transaction, and
        `review link --github-review` writes only the second and needs no draft at all —
        while `RepoSummary.open_reviews` has always counted *that* one as the review no
        longer being open. A review posted through `review link` was therefore in no
        group on any screen, which is the complaint this group exists to answer, so both
        count and the two readings are reconciled rather than noted.

        **Open** means open **or never looked at**: a review the harvester has not read
        back has no recorded pull-request state, so the honest answer is that nothing is
        known and it belongs in the group that says so. One merged or closed at its last
        harvest has no author left to wait for and is not here.

        **Only the newest round of a pull request**, so one pull request is one item.
        The author pushing a fix is the event this group waits for, and it opens the next
        round — after which nothing ever moves the old round's state again, so nothing
        could retract it. Without that, a pull request on round four would draw four
        items each claiming its author owed a reply, which is the defect DEV-876 exists
        to prevent. The store's `work_list` has carried the same restriction, and the
        same argument, since DEV-867.

        **Not a group that is waiting on the developer**, which is why it is outside
        `totals.items`. Nothing in it needs an act; it is the record saying where a
        posted review went.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: The ticket the change is for, opaque.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is, so this row can link it without the review being opened
            first. Null for a review with an id and no address, which the row then names on
            its own line and does not link.
        round: { type: integer, format: int64, minimum: 1 }
        rounds_on_pr:
          type: integer
          format: int64
          minimum: 1
          description: |
            The highest round this pull request has reached, so the item can read "round
            2 of 2" rather than a bare number. Equal to `round` for every item in this
            group, because the group holds only the newest round — stated so that no
            screen has to assume it.
        posted_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the review session reported it posted. **Null for a review posted
            through `review link --github-review`**, which records the GitHub review id
            with no draft transition and so leaves nothing holding the time. The screen
            says so rather than guessing one.
        posted_as:
          oneOf:
            - $ref: '#/components/schemas/ReviewEvent'
            - type: 'null'
          description: |
            The GitHub review event the developer chose at approval, which is what the
            author received it as. Null on the same terms as `posted_at`: no draft, no
            chosen event.
        pr_state:
          oneOf:
            - $ref: '#/components/schemas/PrState'
            - type: 'null'
          description: |
            `open`, or null for a pull request the harvester has never looked at. Never
            `merged` or `closed`: such a review is not in this group at all.

            **Null is the usual answer today**, because nothing in Review Desk polls
            GitHub and running the harvest is another issue's work. The screen has to
            say that the state is not established rather than let the group's heading
            assert that an author is being waited on.
        harvested_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the harvester last read this review back from GitHub.

            **It is also the three counts' measurement time**, and a screen drawing them
            has to say so: a bare nought over a figure measured two hours ago reads as a
            statement about now, and the record only supports one about then.
        findings:
          type: integer
          minimum: 0
          description: How many findings the review holds.
        findings_linked:
          type: integer
          minimum: 0
          description: |
            How many of them carry the id of the GitHub comment they were posted as.

            **This is what says whether a reply could have been seen at all**, and
            `harvested_at` cannot. The harvester reaches a thread through a finding's
            comment id, skips thread reading altogether when no finding has one, and
            marks the review harvested regardless — so a review posted as one body
            rather than as inline comments comes back harvested with nothing read. Zero
            here means there is nothing a reply could attach to, and `replies` is then
            null rather than nought.
        replies:
          type: [integer, 'null']
          minimum: 0
          description: |
            Replies **the pull request's author** wrote in this review's finding threads.

            **The actor, not only the kind.** The harvester records a reply from any
            login that is not the pull request's author against `developer`, so counting
            replies by kind alone credits the author with the reviewer's own. A reply the
            harvester could not attribute to the author is not counted here; the one
            review screen shows every outcome either way.

            **Null, never zero, when nothing could have found one** — that is, when it
            would be zero and either nothing has harvested the review or no finding is
            linked to a comment. Zero is served only when something looked and found
            none, which is a measurement. The converse is served too: a reply the record
            holds is counted even with `harvested_at` null, because the harvest writes
            its outcomes and its own timestamp in separate statements and
            `review-desk outcome add` writes outcomes without a harvest at all — and
            "not harvested yet" printed over a reply the same screen is drawing in
            another group is the same failure in the other direction.
        threads_resolved:
          type: [integer, 'null']
          minimum: 0
          description: |
            Findings whose thread **the author** resolved. Counted by actor and nulled on
            exactly the terms `replies` is — and the actor matters more here, because on
            most repositories the author cannot resolve a review thread, so the reviewer
            does.
        code_changed_after:
          type: [integer, 'null']
          minimum: 0
          description: |
            Findings whose code the harvester found changed after the commit the review
            read, **counted once each**. Not by actor, unlike the two above: the harvester
            attributes this to nobody, because it is an observation about the code and not
            an act by a person. Null when it would be zero and nothing has harvested the
            review.

            Counted once each because the harvester records this per *commit* it saw the
            change in, so a finding whose file is touched by three successive pushes holds
            three rows. A count of the rows would exceed the findings it is about.

            **This issue asks for "commits since" and this is not that.** There is no count
            of commits since a posting anywhere in the record —
            `commits_since_previous_round` counts the commits *before* a round — so a
            screen must not head this column with one.

    DescriptionLint:
      type: object
      additionalProperties: false
      required: [passes]
      description: The review-craft description lint on the developer's own pull request.
      properties:
        passes: { type: boolean }
        budget_ratio:
          type: [number, 'null']
          minimum: 0
          description: Body characters over budget, so the screen can say "2.3× its budget".

    InboxOwnPrItem:
      type: object
      additionalProperties: false
      required: [pull_request]
      description: |
        A pull request of the developer's own with no reviewer. **Review Desk owns none
        of this**: it is GitHub state. The server can read GitHub — `POST /reviews` does,
        to resolve a head commit — but nothing lists the developer's own pull requests,
        and no issue covers it. Every field but `pull_request` is therefore nullable, and
        the group is empty until something supplies it. See contract/README.md.
      properties:
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        opened_at: { type: [string, 'null'], format: date-time }
        description_lint:
          oneOf:
            - $ref: '#/components/schemas/DescriptionLint'
            - type: 'null'

    InboxProposedRuleItem:
      type: object
      additionalProperties: false
      required: [rule_id, rule_key, statement]
      properties:
        rule_id: { type: integer, format: int64, minimum: 1 }
        rule_key: { type: string, pattern: '^R-[0-9]{2,}$' }
        statement: { type: string, minLength: 1 }
        why_proposed: { type: [string, 'null'] }
        scope: { $ref: '#/components/schemas/RuleScope' }

    InboxInProgressItem:
      type: object
      additionalProperties: false
      required:
        [review_id, pull_request, layer_number, layer_name, layers_total, ticket_id,
         ticket_url]
      description: A review a session is still working on.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        pull_request: { $ref: '#/components/schemas/InboxPr' }
        ticket_id:
          allOf:
            - $ref: '#/components/schemas/ForeignId'
          description: The ticket the change is for, opaque.
        ticket_url:
          allOf:
            - $ref: '#/components/schemas/TicketUrl'
          description: |
            Where that ticket is, so this row can link it without the review being opened
            first. Null for a review with an id and no address, which the row then names on
            its own line and does not link.
        layer_number:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            **Six, not seven: step 7 is never "with the agent".** A harvest sets it
            `running` for as long as the pull request stays open (DEV-933), which is a
            quarter-hourly read of GitHub rather than anybody working — so a posted review
            would otherwise sit in this group for weeks, and one whose author had replied
            would appear in two groups of the same Inbox.
        layer_name:
          allOf:
            - $ref: '#/components/schemas/ReviewLayerName'
            - not: { const: harvest }
          description: >-
            The step the session is at. Any of the seven but `harvest`, for the reason
            `layer_number` gives.
        layers_total:
          type: integer
          const: 7
          description: Stated so the screen's "Layer 5 of 7" needs no constant of its own.
        session_id: { $ref: '#/components/schemas/ForeignId' }
        session_alive:
          type: [boolean, 'null']
          description: |
            Whether the Allele session is still running. Allele owns this, not Review
            Desk; null when nothing has told the server. Null is the honest answer and
            the screen must render it, rather than showing "session alive" by default.

            **`last_activity_at` is what the queue shows instead**, since DEV-890: how
            long the record has been silent is a fact Review Desk holds, and "session
            state unknown" was the only thing it could say before.
        in_state_since:
          type: [string, 'null']
          format: date-time
          description: |
            When the review entered the state it is in now — the start of the step's
            current pass. The queue's "running 20 min". Null when the step's current pass
            has no recorded start, which is a review from before DEV-890.
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: |
            When anything last wrote to this review. See `ReviewTimings.last_activity_at`;
            null means nothing has written since the record started keeping this, and the
            queue says so rather than drawing a figure.

    InboxHandled:
      type: object
      additionalProperties: false
      required: [window_days]
      description: |
        What was dealt with without the developer. Each figure is null when its source is
        absent, which for `description_problems_caught` is always until CI reports in.
      properties:
        window_days: { type: integer, minimum: 1 }
        description_problems_caught:
          type: [integer, 'null']
          minimum: 0
          description: Caught by the description CI check. Needs a CI source Review Desk has not got.
        nits_filed:
          type: [integer, 'null']
          minimum: 0
          description: Held-back nits covered by a filed ticket.
        nit_tickets:
          type: [integer, 'null']
          minimum: 0
          description: Tickets those nits were filed as.

    Inbox:
      type: object
      additionalProperties: false
      required:
        - totals
        - briefs_to_confirm
        - drafts_to_approve
        - author_replies
        - own_prs_without_reviewer
        - proposed_rules
        - in_progress
        - posted_awaiting_author
        - handled_without_you
      description: |
        The whole Inbox screen. The five waiting groups are separate arrays rather than
        one tagged list, because each carries different fields and the screen renders
        each differently; `totals.items` is their combined length.

        **Seven arrays, five of which are waiting on the developer.** `in_progress` is
        with the agent and `posted_awaiting_author` is with the author, and neither is in
        `totals.items` — see `InboxTotals`.

        **One row per review, built from the three arrays that wait on a developer's act**
        — `briefs_to_confirm`, `drafts_to_approve` and `author_replies` — with
        `in_progress` and `posted_awaiting_author` **joined onto** a row one of those three
        already made. That is DEV-876's rule and it is a requirement on a client, not a
        convenience: a review in two arrays is one thing to do, not one thing to do twice.
        The example holds exactly that case — review 12 is in `author_replies` *and* in
        `posted_awaiting_author`, and is one row.

        **The ticket's id and address are on those three.** So a review waiting on the
        developer reaches a row carrying the pair whatever of the three put it there. It
        was on `briefs_to_confirm` alone to begin with, which was a bug: a review whose
        brief had been confirmed and whose draft was waiting had a row, an address on the
        record, and no way to reach it — while the Reviews list showed the link for that
        same review.

        **All five arrays about a review carry the pair** — the seven here less
        `own_prs_without_reviewer`, which is a pull request nobody has reviewed, and
        `proposed_rules`, which is about a rule.

        The join is not all the other two arrays do: `in_progress` holds reviews nothing is
        waiting on the developer for — 18 and 19 in the example — and
        `posted_awaiting_author` holds 14, and each of those
        draws a row of its own. So a row that could not reach its ticket while
        `GET /reviews` linked it was a gap, and this closes it rather than restating it.

        It was open for a few commits, with a reason that has since expired: DEV-933 was
        changing `InboxInProgressItem`'s shape at the same time, and widening it then would
        have been two changes to one schema at once. DEV-933 merged, so the reason went with
        it.
      properties:
        totals: { $ref: '#/components/schemas/InboxTotals' }
        briefs_to_confirm:
          type: array
          items: { $ref: '#/components/schemas/InboxBriefItem' }
        drafts_to_approve:
          type: array
          items: { $ref: '#/components/schemas/InboxDraftItem' }
        author_replies:
          type: array
          items: { $ref: '#/components/schemas/InboxReplyItem' }
        own_prs_without_reviewer:
          type: array
          items: { $ref: '#/components/schemas/InboxOwnPrItem' }
        proposed_rules:
          type: array
          items: { $ref: '#/components/schemas/InboxProposedRuleItem' }
        in_progress:
          type: array
          items: { $ref: '#/components/schemas/InboxInProgressItem' }
        posted_awaiting_author:
          type: array
          items: { $ref: '#/components/schemas/InboxPostedItem' }
          description: |
            Posted reviews whose pull request has not been merged or closed, newest
            posting first. **Empty is a claim**, and a true one: it says the record holds
            no posted review with an open pull request. Before DEV-930 there was no array
            here at all, and the screen could only say the question was not measured.
        handled_without_you: { $ref: '#/components/schemas/InboxHandled' }

    # ----------------------------------------------------------------------------------
    # Rounds: a finding's identity across them, and what changed between them. DEV-873.
    #
    # One section rather than fields scattered through the document, so that the three
    # sessions adding to this contract at once stay out of each other's way. The two
    # additions outside it are `Finding`'s round fields and `ReviewDetail`'s two arrays,
    # both of which have to sit with what they describe.
    # ----------------------------------------------------------------------------------

    RoundStatus:
      type: string
      description: |
        What became of a finding **in one round**. The same closed set as `RoundStatus` in
        `crates/store/src/model.rs`, with the same wire strings.

        **Not the same question as `Disposition`**, and the two are both served. A
        disposition says what is to become of the finding in this round's draft; this says
        what happened to the finding itself — so a finding can be `fixed` and still carry
        whatever disposition it was carried with.

        **Nothing here changes a disposition from a status**, deliberately: what goes in the
        draft is the draft's composition, which an agent decides with
        `review-desk finding set`. A fixed finding therefore still counts toward
        `DraftLint.findings_expected` until something moves it, which `contract/README.md`
        records as a known gap rather than a thing this field fixes.

        `new` is every finding in the round it was raised in, and every finding written
        before migration 7 — nothing before that migration could carry one, so `new` is
        the honest reading of a review from before this change.

        **Nothing derives one of these.** An agent or the developer sets it and says how
        they checked; DEV-873 puts deciding it automatically out of scope.
      enum: [new, fixed, still_open, accepted, withdrawn, ticketed]

    DecidedBy:
      type: string
      description: |
        Who decided a finding's status in a round.

        **Deliberately not `Actor`.** That set is developer, author or harvester, and it has
        no value for an agent — which decides most of these. Recording an agent's decision
        as `developer` would put the developer's name against a check nobody showed them.

        **This is not a sign-off.** Only the developer signs off, and only in the dashboard:
        `confirmBrief` and `approveDraft` are the two operations that do it, and both record
        `Actor.developer`. Saying a finding is fixed is a statement about the code.
      enum: [developer, agent, author]

    RoundStatusCounts:
      type: object
      additionalProperties: false
      required: [new, fixed, still_open, accepted, withdrawn, ticketed]
      description: |
        How a round's findings stand — "2 fixed · 2 still open · 1 new". Zero is a
        measurement here, not an absence: the counts are of findings the record holds.
      properties:
        new: { type: integer, minimum: 0 }
        fixed: { type: integer, minimum: 0 }
        still_open: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        withdrawn: { type: integer, minimum: 0 }
        ticketed: { type: integer, minimum: 0 }

    RoundCommit:
      type: object
      additionalProperties: false
      required: [sha, position, summary, files]
      description: |
        One commit between the previous round's head commit and this round's — a row of
        "what changed since round 1".

        Read from GitHub through the harvest crate and stored. Nothing is written to
        GitHub.
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
          description: The commit, as GitHub gave it. Opaque; never parsed.
        position:
          type: integer
          minimum: 0
          description: |
            Where GitHub listed it, from 0, oldest first. Stored rather than sorted by
            `committed_at`: a rebased or amended commit can carry a committer date out of
            order, and the order the page shows is the order the pull request has.
        summary:
          type: string
          minLength: 1
          description: The commit message's first line, as GitHub sent it.
        committed_at:
          type: [string, 'null']
          format: date-time
        files:
          type: array
          items: { type: string, minLength: 1 }
          description: |
            The files it touched, in path order. Empty when GitHub would not answer for
            this commit, which is why `Finding.late` is null rather than false in that
            case.

    RoundSummary:
      type: object
      additionalProperties: false
      required:
        [review_id, round, head_sha, created_at, findings, commits, replies,
         threads_resolved, statuses]
      description: |
        One round of a pull request, as the timeline across the top of the round-two page
        reads it: when it was posted, as which event, how many findings it held, and what
        came back.
      properties:
        review_id: { type: integer, format: int64, minimum: 1 }
        round: { type: integer, format: int64, minimum: 1 }
        head_sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        created_at: { type: string, format: date-time }
        posted_at:
          type: [string, 'null']
          format: date-time
          description: |
            When this round's draft was reported posted. Null for a round that has not
            been — including the round being worked on now.
        event:
          oneOf:
            - $ref: '#/components/schemas/ReviewEvent'
            - type: 'null'
          description: |
            What it was posted as, or is to be posted as once approved. Null while no draft
            has been approved.
        findings:
          type: integer
          minimum: 0
          description: How many findings the round held, carried ones included.
        commits:
          type: integer
          minimum: 0
          description: |
            Commits recorded between the previous round's head and this one's. Zero can
            mean "none recorded" as well as "nothing changed"; the two are told apart by
            `commits_since_previous_round` being empty either way, which is why `late` is
            three-valued.
        replies:
          type: integer
          minimum: 0
          description: Replies the harvester read on this round's findings.
        threads_resolved:
          type: integer
          minimum: 0
        statuses: { $ref: '#/components/schemas/RoundStatusCounts' }
    # ---------------------------------------------------------------------------------
    # Where a review's understanding came from. DEV-875, board A2 sections 1 to 4.
    #
    # **All of it is written by the agent through the command line** — `review-desk
    # provenance sources|criteria|changes|lint`. No operation in this document writes any
    # of it: none of it is the developer's to decide, and Review Desk reads no ticket.
    # ---------------------------------------------------------------------------------

    SourceKind:
      type: string
      description: |
        What kind of thing a review read the problem from. Three values, because three are
        what a review has to read from: the ticket, the author's own description of the
        change, and what was said on the pull request before this round. The code is not
        among them — a review always reads the code, so saying so carries nothing.
      enum: [ticket, description, comment]

    ReviewSource:
      type: object
      additionalProperties: false
      required: [position, kind, label]
      description: |
        One thing the review read the problem from — a row of "Read from" under the title.

        **Review Desk did not fetch any of this.** It is what the session said it read, in
        the session's own words, and `link` is never followed.
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
          description: |
            Where it comes in the list, from 1. Assigned from the order written, because
            two comments on one pull request have nothing else to tell them apart.
        kind: { $ref: '#/components/schemas/SourceKind' }
        label:
          type: string
          minLength: 1
          description: |
            What to call it on screen — "ABC-231 · Retry webhook deliveries for 24 hours",
            "The pull request description", "2 earlier comments on the pull request".
        link:
          type: [string, 'null']
          minLength: 1
          description: Where to follow it to. Opaque — Review Desk never fetches it.

        # -- the two columns the sources table added (DEV-917) -----------------------
        status:
          type: [string, 'null']
          minLength: 1
          description: |
            The ticket's state **as the session read it** — "Backlog", "Dev Released".

            Free text rather than an enum, and deliberately: every tracker names its own
            columns, so a fixed set here would either refuse a real board or quietly
            rename it. Review Desk read no ticket; this is what the session said it saw.

            Null for a source whose state nobody reported, which is every source recorded
            before DEV-917, and the table's cell is then empty.
        note:
          type: [string, 'null']
          minLength: 1
          description: |
            What this source tells us, in one line — the sources table's "What it tells
            us" column.

            Null for a source that recorded none, and the row then shows its reference
            alone. No length is enforced; a note that runs to a paragraph is a writing
            fault and belongs to the linter in Locus.

    CriterionStatus:
      type: string
      description: |
        Whether the change does what the ticket asked for. Three values and no fourth:
        "partly" was considered and refused, because a criterion half met is a criterion
        not met and the finding says which half.

        **`not_met` names a finding**, and the store refuses one that does not: a review
        that says the change fails a criterion and raises nothing about it posts a review
        that never mentions the failure.
      enum: [met, not_met, not_in_this_pr]

    AcceptanceCriterion:
      type: object
      additionalProperties: false
      required: [position, text, status]
      description: |
        One thing the ticket asks for, and whether the change does it — a row of "What the
        ticket asks for".

        **At most one pointer.** `finding_seq`, or `file` with an optional `line`, or
        `note` — never two, because nothing could say which one a screen follows. A `met`
        criterion may carry none; a `not_met` one always carries the finding.
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
          description: Where it comes in the list, from 1, as the session wrote it.
        text:
          type: string
          minLength: 1
          description: What the ticket asks for, in the ticket's own terms.
        status: { $ref: '#/components/schemas/CriterionStatus' }
        finding_seq:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            The finding that says this is not met. Non-null whenever `status` is
            `not_met`, and it is a finding on this same review.
        finding_key:
          type: [string, 'null']
          pattern: '^F[0-9]+$'
          description: |
            `finding_seq` as a person quotes it — `F1`. Derived, like `Finding.key`, so
            the dashboard never computes an identifier.
        file:
          type: [string, 'null']
          description: The file that answers for it.
        line:
          type: [integer, 'null']
          minimum: 1
          description: |
            The line in that file. Never set without `file` — unlike a finding, where a
            line alone is still worth saying, a criterion's pointer is somewhere to go.
        note:
          type: [string, 'null']
          description: |
            Anything else that answers for it — "The description says it follows in
            ABC-240", which is what a `not_in_this_pr` criterion carries.

    DescriptionLintStatus:
      type: string
      description: |
        What one check of the pull request description reported. `warn` exists because the
        review-craft description lint has warnings that do not fail it, and a warning
        folded into `pass` is a warning nobody sees.
      enum: [pass, warn, fail]

    DescriptionLintResult:
      type: object
      additionalProperties: false
      required: [position, label, status]
      description: One named check of the pull request description — a line of the Lint section.
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
          description: Where it comes in the list, from 1, as the session wrote it.
        label:
          type: string
          minLength: 1
          description: What was checked — "Description length", "Working notes", "Template".
        status: { $ref: '#/components/schemas/DescriptionLintStatus' }
        detail:
          type: [string, 'null']
          description: |
            What it found — "1,840 of 2,568 characters", "All 5 headings present". The
            whole point of this record: `passes` alone could serve none of those lines.

    ReviewDescriptionLint:
      type: object
      additionalProperties: false
      required: [passes, results]
      description: |
        Layer 1's result on the pull request's description, as its individual checks.

        Served only when the lint has run, so `results` is never empty — a lint with no
        results is `description_lint: null`, not an object claiming to have measured
        nothing.
      properties:
        passes:
          type: boolean
          description: |
            **Derived: true when no result is `fail`.** A warning does not fail it,
            matching `DraftLint.passes`.

            Nothing stores this, deliberately. A stored verdict could sit above the list
            the screen shows beside it and contradict it, and a page showing both must not
            be able to show a disagreement.
        results:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DescriptionLintResult' }

    FileCheck:
      type: string
      description: |
        How a file in the change was looked at. The free sentence beside it says what was
        done; this is the part a reader can count, and the part that makes an unreviewed
        area impossible to overlook.

        `not_reviewed` is the highlighted row, and the store refuses one with no reason.
      enum: [read_in_full, read_in_part, run, not_reviewed]

    FileChange:
      type: object
      additionalProperties: false
      required:
        - position
        - path
        - summary
        - lines_added
        - lines_removed
        - checked
        - finding_seqs
        - finding_keys
      description: |
        One file the change touched, or one area it did not — a row of "What they built".
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
          description: Where it comes in the table, from 1, as the session wrote it.
        path:
          type: string
          minLength: 1
          description: |
            The file's path, or a pattern for an area — `resources/admin/**`. One entry per
            path: two rows for one file would be two coverage claims about it.
        summary:
          type: string
          minLength: 1
          description: What changed in it, in one line.
        lines_added: { type: integer, minimum: 0 }
        lines_removed: { type: integer, minimum: 0 }
        checked: { $ref: '#/components/schemas/FileCheck' }
        how_checked:
          type: [string, 'null']
          description: |
            How it was checked, in the reviewer's own words — "Read in full. Compared with
            2 sibling senders." **Non-null whenever `checked` is `not_reviewed`**, where it
            is the reason: an area with no coverage owes a reader that much.
        finding_seqs:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
          description: |
            The review's findings on this path, in sequence order.

            **Derived from the findings, not stored against this entry.** That is what
            makes DEV-875's "a finding listed on a file exists and points at that file"
            true by construction: there is no second copy of the join to go stale. A
            finding added after the change map was written appears here without the map
            being rewritten, and an area recorded as `not_reviewed` has none.
            **Matched on the finding's own `file`**, which is where the finding is, not
            where any code shown beside it comes from. The distinction is worth stating
            because a finding may point at one file and draw its evidence from another — a
            call site, a sibling implementation — so a reader otherwise has two plausible
            columns to guess between. This row lists the findings *about* this path.
        finding_keys:
          type: array
          items: { type: string, pattern: '^F[0-9]+$' }
          description: |
            The same findings as a person quotes them — `["F1", "F2"]`. One entry per
            `finding_seqs` entry, in the same order.

    CoverageSource:
      type: string
      description: |
        Which record a screen renders as this review's coverage, and the only field it
        should decide that from.

        - `files` — the review has a per-file change map. Render it; `not_checked` is null.
        - `sentence` — it has no change map and `not_checked` is set. Render that sentence.
        - `none` — it has neither, and the screen shows no coverage section at all.

        Derived, never stored. There is one place the question is answered, so the two
        records cannot both be rendered and cannot disagree.
      enum: [files, sentence, none]

    Coverage:
      type: object
      additionalProperties: false
      required: [source, files]
      description: |
        What the review looked at and what it did not, as one answer.

        **This replaces the single "not checked" sentence as the source for coverage, and
        the sentence stays for the posted review** — DEV-875. The two live in one object
        with one arbiter, `source`, because two coverage records a page could render side
        by side are two records that will eventually say different things.
      properties:
        source: { $ref: '#/components/schemas/CoverageSource' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
          description: |
            The change map, in the order the session wrote it. Empty exactly when `source`
            is not `files`. The rows with `checked: not_reviewed` are the highlighted ones;
            a screen filters for them rather than reading a second list that could differ
            from this one.
